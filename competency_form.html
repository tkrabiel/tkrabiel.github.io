    <style>

        table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
        th { background: #333; color: white; text-transform: uppercase; padding: 12px; border: 1px solid #000; font-size: 11px; }
        td { border: 1px solid #000; padding: 10px; vertical-align: top; font-size: 12px; word-wrap: break-word; min-height: 40px; }

        /* Manual Entry Styling */
        td[contenteditable="true"] { background: #ffffff; outline: none; transition: 0.2s; }
        td[contenteditable="true"]:hover { background: #fdfdfd; box-shadow: inset 0 0 5px rgba(0,74,153,0.2); }
        td[contenteditable="true"]:focus { background: #fff; border: 2px solid #ffc107 !important; }

        .header-row { background: #004a99 !important; color: white; font-weight: bold; font-size: 14px; text-align: center; }
        .subheader-row { background: #e9ecef !important; font-weight: bold; font-size: 13px; }
        .highlight { border-left: 10px solid #ffc107 !important; background-color: #fffdec !important; }

        .id-col { width: 75px; font-weight: bold; text-align: center; background: #f8f9fa; }
        .desc-col { width: 30%; text-align: center; font-weight: bold; color: #004a99;}
        .eng-col { width: 85px; text-align: center; font-weight: bold; color: #004a99; }
        .detail-col { width: auto; }

        h1 { text-align: center; margin-bottom: 5px; color: #004a99; text-transform: uppercase; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-weight: bold; text-transform: uppercase; }

        @media print {
            .controls { display: none; }
            body { background: white; padding: 0; }
            .container { border: none; box-shadow: none; width: 100%; max-width: 100%; padding: 10px; }
            tr { page-break-inside: avoid; }
            .header-row { background-color: #004a99 !important; -webkit-print-color-adjust: exact; }
            .subheader-row { background-color: #e9ecef !important; -webkit-print-color-adjust: exact; }
            .highlight { background-color: #fffdec !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>

    let activeJSON = null;

    document.getElementById('jsonInput').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            activeJSON = JSON.parse(event.target.result);
            renderTable();
        };
        reader.readAsText(e.target.files[0]);
    };

    function renderTable() {
        const levelKey = document.getElementById('levelSelect').value;
        const tbody = document.getElementById('tableBody');
        const title = document.getElementById('formTitle');
        const subtitle = document.getElementById('formSubtitle');
        
        title.innerText = `Competency Form ${levelKey === 'S5A' ? 'S-5A' : 'S-5B'}`;
        subtitle.innerText = levelKey === 'S5A' ? 'Level 1 - Certified Master Hydrographer (CMH)' : 'Level 2 - Certified Hydrographer (CH)';
        tbody.innerHTML = "";

        const tagMap = {};
        if (activeJSON) {
            activeJSON.data.forEach(eng => {
                // SCAN ALL TEXT FIELDS (Project Description, Responsibilities, etc.)
                const searchableText = [eng.j_proj, eng.j_resp, eng.j_comments].join(" ");
                const regex = /@([A-Z0-9.]+)\s*\[(.*?)\]/g;
                let match;
                while ((match = regex.exec(searchableText)) !== null) {
                    const id = match[1];
                    if (!tagMap[id]) tagMap[id] = { engs: [], details: [] };
                    tagMap[id].engs.push(eng.e_number);
                    tagMap[id].details.push(`(Eng #${eng.e_number}): ${match[2]}`);
                }
            });
        }

        masterData[levelKey].forEach(item => {
            const userData = tagMap[item.id] || null;
            const row = document.createElement('tr');
            
            if (item.type === "H") {
                row.className = "header-row";
                row.innerHTML = `<td colspan="4">${item.desc}</td>`;
            } else if (item.type === "S") {
                row.className = "subheader-row";
                row.innerHTML = `<td class="id-col">${item.id}</td><td colspan="3">${item.desc}</td>`;
            } else {
                if (userData) row.className = "highlight";
                
                // Content Columns (Editable)
                row.innerHTML = `
                    <td class="id-col">${item.id}</td>
                    <td class="desc-col">${item.desc}</td>
                    <td class="eng-col" contenteditable="true">${userData ? [...new Set(userData.engs)].sort((a,b)=>a-b).join(", ") : ""}</td>
                    <td class="detail-col" contenteditable="true">${userData ? userData.details.join("<br>") : ""}</td>
                `;
            }
            tbody.appendChild(row);
        });
    }

    renderTable(); // Initial draw
