<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Tide Viewer · 2D Shoreline Animation</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1a2e3c;
      color: #e6f0f5;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-weight: 400;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      background: #0f222b;
      padding: 15px 20px;
      border-radius: 50px;
    }
    select, input, button {
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid #3a7a8c;
      background: #1e3a48;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
    }
    button {
      background: #2a9d8f;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #21867a; }
    .time-controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .main-panel {
      display: flex;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .chart-container {
      flex: 1.2;
      background: #0f222b;
      border-radius: 24px;
      padding: 15px;
      box-shadow: inset 0 0 10px #00000030;
    }
    .scene-container {
      flex: 1;
      background: #0a1a22;
      border-radius: 24px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    #tideChart {
      width: 100% !important;
      height: 100% !important;
    }
    #sceneCanvas {
      width: 100%;
      height: auto;
      background: #112a35;
      border-radius: 16px;
      display: block;
      border: 2px solid #2a4a6a;
    }
    .depth-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #9ac7d9;
    }
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .legend span::before {
      content: "■";
      margin-right: 5px;
      font-size: 1.2rem;
      vertical-align: middle;
    }
    .water-level-indicator {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      margin: 5px 0;
    }
    #currentHeightDisplay {
      color: #7fc4e4;
    }
    .clock {
      font-family: monospace;
      font-size: 1.1rem;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <h1>🌊 Tide Viewer · USA Stations <span style="font-size:1rem; background:#1a7a8c40; padding:2px 18px; border-radius:40px;">2D Shoreline Animation</span></h1>
  
  <div class="controls">
    <select id="stationSelect">
      <option value="sf">🌉 San Francisco, CA</option>
      <option value="boston">⚓ Boston, MA</option>
      <option value="anchorage">❄️ Anchorage, AK</option>
      <option value="seattle">🌲 Seattle, WA</option>
      <option value="portsmouth">🦞 Portsmouth, NH</option>
      <option value="portland">🦐 Portland, ME</option>
      <option value="galveston">🌴 Galveston, TX</option>
      <option value="sanjuan">🇵🇷 San Juan, PR</option>
      <option value="nyc">🗽 New York, NY</option>
      <option value="stpete">🌴 St. Petersburg, FL</option>
    </select>
    <input type="date" id="datePicker" value="2025-01-01">
    <input type="time" id="timePicker" value="00:00">
    <button id="setTimeBtn">Set</button>
    <div class="time-controls">
      <button id="rewindBtn" title="Rewind 1 hour">⏪</button>
      <button id="playPauseBtn">▶️ Play</button>
      <button id="fastForwardBtn" title="Fast forward 1 hour">⏩</button>
      <button id="resetBtn">⟲ Jan 1</button>
    </div>
    <div style="display:flex; align-items:center; gap:5px; margin-left:10px;">
      <span>⏩ Speed</span>
      <input type="range" id="speedSlider" min="0.5" max="5.0" step="0.5" value="1.5" style="width:100px;">
    </div>
    <div class="clock" id="clockDisplay">2025-01-01 00:00 GMT</div>
  </div>

  <div class="main-panel">
    <div class="chart-container">
      <canvas id="tideChart"></canvas>
    </div>
    <div class="scene-container">
      <canvas id="sceneCanvas" width="500" height="350"></canvas>
      <div class="water-level-indicator">
        Water height: <span id="currentHeightDisplay">0.00 ft</span> (MLLW)
      </div>
      <div class="depth-labels">
        <span>🪨 Rocks (2 ft)</span>
        <span>🚢 Wreck (10 ft)</span>
        <span>📏 MLLW (20 ft)</span>
      </div>
      <div class="legend">
        <span style="color:#3a9bdc;">■ Water</span>
        <span style="color:#8b5e3c;">■ Seabed</span>
        <span style="color:#a0a0a0;">■ Rocks</span>
        <span style="color:#8b4513;">■ Shipwreck</span>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // ---------- Station database (harmonic constants, MLLW datum) ----------
      const STATIONS = {
        sf:      { name: 'San Francisco', consts: [0.542,0.142,0.112,0.368,0.233,0.122], phases: [330.5,358.9,306.7,342.3,315.8,340.1] },
        boston:  { name: 'Boston', consts: [2.840,0.540,0.540,0.190,0.140,0.060], phases: [135.2,172.8,108.0,195.5,184.2,195.0] },
        anchorage:{ name: 'Anchorage', consts: [3.940,1.110,0.620,1.890,1.310,0.600], phases: [282.8,322.0,248.0,195.4,164.7,194.0] },
        seattle: { name: 'Seattle', consts: [0.961,0.231,0.199,0.523,0.323,0.171], phases: [222.5,247.3,195.6,230.4,211.2,229.1] },
        portsmouth:{ name: 'Portsmouth', consts: [2.680,0.510,0.510,0.180,0.130,0.055], phases: [142.5,178.0,115.0,200.0,188.0,198.0] },
        portland: { name: 'Portland', consts: [2.960,0.560,0.570,0.200,0.145,0.065], phases: [131.8,166.2,104.0,193.0,181.5,192.0] },
        galveston:{ name: 'Galveston', consts: [0.225,0.055,0.045,0.175,0.120,0.055], phases: [275.0,310.0,250.0,320.0,300.0,318.0] },
        sanjuan:  { name: 'San Juan', consts: [0.098,0.029,0.018,0.082,0.060,0.027], phases: [245.0,285.0,220.0,310.0,290.0,308.0] },
        nyc:      { name: 'New York', consts: [1.360,0.300,0.280,0.110,0.075,0.035], phases: [152.0,187.0,125.0,215.0,205.0,213.0] },
        stpete:   { name: 'St. Petersburg', consts: [0.165,0.052,0.027,0.162,0.146,0.053], phases: [54.5,64.8,48.2,334.6,326.8,333.0] }
      };
      const CONST_NAMES = ['M2','S2','N2','K1','O1','P1'];
      const SPEEDS = { M2:28.984104, S2:30.0, N2:28.43973, K1:15.041069, O1:13.943035, P1:14.958931 };
      
      // State
      let currentStationKey = 'sf';
      let currentTime = new Date(Date.UTC(2025,0,1,0,0,0));
      let isPlaying = false;
      let speed = 1.5; // hours per real second (approx)
      let chartInstance = null;
      let animFrame = null;
      
      // DOM elements
      const stationSelect = document.getElementById('stationSelect');
      const datePicker = document.getElementById('datePicker');
      const timePicker = document.getElementById('timePicker');
      const setTimeBtn = document.getElementById('setTimeBtn');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const rewindBtn = document.getElementById('rewindBtn');
      const fastForwardBtn = document.getElementById('fastForwardBtn');
      const resetBtn = document.getElementById('resetBtn');
      const speedSlider = document.getElementById('speedSlider');
      const clockDisplay = document.getElementById('clockDisplay');
      const currentHeightDisplay = document.getElementById('currentHeightDisplay');
      const sceneCanvas = document.getElementById('sceneCanvas');
      const ctx = sceneCanvas.getContext('2d');
      
      // Helper: compute tide height (feet) relative to MLLW
      function computeTideHeight(stationKey, hoursFromRef) {
        const s = STATIONS[stationKey];
        let total = 0;
        CONST_NAMES.forEach((n, i) => {
          total += s.consts[i] * Math.cos((SPEEDS[n] * hoursFromRef - s.phases[i]) * Math.PI/180);
        });
        return total;
      }
      
      // Update the 2D scene with current water level (height in feet, MLLW datum)
      function drawScene(waterHeightFt) {
        const w = sceneCanvas.width, h = sceneCanvas.height;
        ctx.clearRect(0, 0, w, h);
        
        // Seabed (from bottom up to MLLW level at 20 ft depth)
        const seafloorY = h - 40; // bottom margin
        const mllwY = seafloorY - 20 * 3; // scale: 3 pixels per foot
        const waterSurfaceY = mllwY - waterHeightFt * 3; // positive height = higher water (lower Y)
        
        // Draw sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
        skyGrad.addColorStop(0, '#1a3a4a');
        skyGrad.addColorStop(1, '#3a7a9c');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, waterSurfaceY);
        
        // Water body
        ctx.fillStyle = '#3a9bdc';
        ctx.globalAlpha = 0.7;
        ctx.fillRect(0, waterSurfaceY, w, seafloorY - waterSurfaceY);
        ctx.globalAlpha = 1.0;
        
        // Seabed (sand/mud)
        ctx.fillStyle = '#8b5e3c';
        ctx.beginPath();
        ctx.rect(0, seafloorY, w, h - seafloorY);
        ctx.fill();
        
        // Rocks (at depth 2 ft relative to MLLW)
        const rockBaseY = mllwY + 2 * 3; // 2 ft below MLLW = higher Y
        ctx.fillStyle = '#6a6a6a';
        ctx.shadowColor = '#00000040';
        ctx.shadowBlur = 6;
        // left rocks
        ctx.beginPath();
        ctx.ellipse(60, rockBaseY - 5, 20, 12, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#505050';
        ctx.beginPath();
        ctx.ellipse(100, rockBaseY - 8, 15, 10, 0, 0, Math.PI*2);
        ctx.fill();
        // right rocks
        ctx.fillStyle = '#5a5a5a';
        ctx.beginPath();
        ctx.ellipse(380, rockBaseY - 6, 25, 14, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Shipwreck (at depth 10 ft)
        const wreckY = mllwY + 10 * 3;
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#6b3e1a';
        ctx.strokeStyle = '#3b1e0a';
        ctx.lineWidth = 3;
        // hull
        ctx.beginPath();
        ctx.ellipse(250, wreckY - 4, 45, 12, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        // mast
        ctx.beginPath();
        ctx.moveTo(250, wreckY - 16);
        ctx.lineTo(260, wreckY - 40);
        ctx.lineTo(240, wreckY - 40);
        ctx.closePath();
        ctx.fillStyle = '#5a3a1a';
        ctx.fill();
        ctx.strokeStyle = '#3b1e0a';
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Water surface line
        ctx.beginPath();
        ctx.moveTo(0, waterSurfaceY);
        ctx.lineTo(w, waterSurfaceY);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Depth markers
        ctx.font = '12px Inter';
        ctx.fillStyle = '#dddddd';
        ctx.fillText('Rocks (2 ft)', 70, rockBaseY - 15);
        ctx.fillText('Wreck (10 ft)', 220, wreckY - 20);
        ctx.fillText('MLLW (20 ft)', 350, mllwY - 5);
        
        // Update current height display
        currentHeightDisplay.textContent = waterHeightFt.toFixed(2) + ' ft';
      }
      
      // Update everything: chart, scene, clock
      function refreshAll() {
        const ref = new Date(Date.UTC(2025,0,1,0,0,0));
        const hoursNow = (currentTime - ref) / 3600000;
        const height = computeTideHeight(currentStationKey, hoursNow);
        
        // Update clock
        clockDisplay.textContent = currentTime.toISOString().slice(0,10) + ' ' + currentTime.toISOString().slice(11,19) + ' GMT';
        
        // Update 2D scene
        drawScene(height);
        
        // Update chart (48h window centered)
        const labels = [], heights = [];
        const startH = hoursNow - 24, endH = hoursNow + 24;
        for (let h = startH; h <= endH; h += 0.5) {
          heights.push(computeTideHeight(currentStationKey, h));
          const d = new Date(ref.getTime() + h * 3600000);
          labels.push(d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'GMT' }));
        }
        
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(document.getElementById('tideChart'), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Water level (ft MLLW)',
              data: heights,
              borderColor: '#2a9d8f',
              backgroundColor: 'rgba(42,157,143,0.1)',
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.2,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { maxTicksLimit: 8 }, grid: { color: '#3a5a6a' } },
              y: { grid: { color: '#3a5a6a' } }
            }
          }
        });
      }
      
      // Animation step
      function step() {
        if (isPlaying) {
          currentTime = new Date(currentTime.getTime() + 1000 * 60 * speed); // advance minutes
          refreshAll();
        }
        animFrame = requestAnimationFrame(step);
      }
      
      // Event listeners
      stationSelect.addEventListener('change', e => {
        currentStationKey = e.target.value;
        refreshAll();
      });
      
      setTimeBtn.addEventListener('click', () => {
        currentTime = new Date(`${datePicker.value}T${timePicker.value}Z`);
        refreshAll();
      });
      
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
      });
      
      rewindBtn.addEventListener('click', () => {
        currentTime = new Date(currentTime.getTime() - 60 * 60 * 1000);
        refreshAll();
      });
      
      fastForwardBtn.addEventListener('click', () => {
        currentTime = new Date(currentTime.getTime() + 60 * 60 * 1000);
        refreshAll();
      });
      
      resetBtn.addEventListener('click', () => {
        currentTime = new Date(Date.UTC(2025,0,1,0,0,0));
        datePicker.value = '2025-01-01';
        timePicker.value = '00:00';
        refreshAll();
      });
      
      speedSlider.addEventListener('input', e => speed = parseFloat(e.target.value));
      
      // Initialize
      refreshAll();
      step();
      
      window.addEventListener('beforeunload', () => {
        if (animFrame) cancelAnimationFrame(animFrame);
      });
    })();
  </script>
</body>
</html>
