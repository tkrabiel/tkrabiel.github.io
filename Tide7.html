<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌍 Tide Dot · 3D NOAA Station</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #020812;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(10, 30, 40, 0.8);
      padding: 12px 24px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
      border-left: 4px solid #2a9d8f;
      pointer-events: none;
      z-index: 10;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(10, 30, 40, 0.75);
      backdrop-filter: blur(8px);
      color: white;
      padding: 16px 24px;
      border-radius: 40px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      z-index: 30;
      pointer-events: auto;
      border: 1px solid #3a9bdc40;
    }
    button {
      background: #1a7a8c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #3a9bdc;
    }
    button.outline { background: transparent; border: 1.5px solid #2a9d8f; }
    select, input {
      padding: 8px 16px;
      border-radius: 40px;
      border: 1.5px solid #aacfdf;
      background: white;
      font-family: inherit;
    }
    .slider-container { display: flex; align-items: center; gap: 12px; }
    #clock {
      font-size: 1.2rem;
      font-weight: 500;
      margin-left: auto;
    }
    #stats {
      position: absolute;
      bottom: 100px;
      right: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="info">
    <h1 style="margin:0; font-weight:500;">🌍 Tide Dot · 3D NOAA Station</h1>
    <div>Dot expands with tide height · color = amplitude (blue→red)</div>
  </div>

  <div id="stats">
    <span>📍 <span id="stationDisplay">San Francisco</span> · Height: <span id="heightDisplay">0.00</span> m (MLLW)</span>
  </div>

  <div id="controls">
    <select id="stationSelect" style="min-width:220px;">
      <option value="sf">🌉 San Francisco (37.8°N, 122.4°W)</option>
      <option value="boston">⚓ Boston (42.3°N, 71.0°W)</option>
      <option value="anchorage">❄️ Anchorage (61.2°N, 149.9°W)</option>
      <option value="seattle">🌲 Seattle (47.6°N, 122.3°W)</option>
      <option value="portsmouth">🦞 Portsmouth, NH (43.1°N, 70.7°W)</option>
      <option value="portland">🦐 Portland, ME (43.7°N, 70.2°W)</option>
      <option value="galveston">🌴 Galveston, TX (29.3°N, 94.8°W)</option>
      <option value="sanjuan">🇵🇷 San Juan, PR (18.5°N, 66.1°W)</option>
      <option value="nyc">🗽 New York (40.7°N, 74.0°W)</option>
      <option value="stpete">🌴 St. Petersburg, FL (27.8°N, 82.6°W)</option>
    </select>
    <div style="display:flex; gap:10px;">
      <input type="date" id="datePicker" value="2025-01-01">
      <input type="time" id="timePicker" value="00:00">
    </div>
    <button id="setTimeBtn">Set time</button>
    <button id="playPauseBtn">⏸️ Pause</button>
    <button id="resetBtn" class="outline">⟲ Reset to Jan 1</button>
    <div class="slider-container">
      <span>⏩</span>
      <input type="range" id="speedSlider" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>
    <div id="clock">🕒 2025-01-01 00:00 GMT</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---------- Station data ----------
    const STATIONS = {
      sf: { name: 'San Francisco', lat: 37.8, lon: -122.4, consts: [0.542,0.142,0.112,0.368,0.233,0.122], phases: [330.5,358.9,306.7,342.3,315.8,340.1] },
      boston: { name: 'Boston', lat: 42.3, lon: -71.0, consts: [2.840,0.540,0.540,0.190,0.140,0.060], phases: [135.2,172.8,108.0,195.5,184.2,195.0] },
      anchorage: { name: 'Anchorage', lat: 61.2, lon: -149.9, consts: [3.940,1.110,0.620,1.890,1.310,0.600], phases: [282.8,322.0,248.0,195.4,164.7,194.0] },
      seattle: { name: 'Seattle', lat: 47.6, lon: -122.3, consts: [0.961,0.231,0.199,0.523,0.323,0.171], phases: [222.5,247.3,195.6,230.4,211.2,229.1] },
      portsmouth: { name: 'Portsmouth', lat: 43.1, lon: -70.7, consts: [2.680,0.510,0.510,0.180,0.130,0.055], phases: [142.5,178.0,115.0,200.0,188.0,198.0] },
      portland: { name: 'Portland', lat: 43.7, lon: -70.2, consts: [2.960,0.560,0.570,0.200,0.145,0.065], phases: [131.8,166.2,104.0,193.0,181.5,192.0] },
      galveston: { name: 'Galveston', lat: 29.3, lon: -94.8, consts: [0.225,0.055,0.045,0.175,0.120,0.055], phases: [275.0,310.0,250.0,320.0,300.0,318.0] },
      sanjuan: { name: 'San Juan', lat: 18.5, lon: -66.1, consts: [0.098,0.029,0.018,0.082,0.060,0.027], phases: [245.0,285.0,220.0,310.0,290.0,308.0] },
      nyc: { name: 'New York', lat: 40.7, lon: -74.0, consts: [1.360,0.300,0.280,0.110,0.075,0.035], phases: [152.0,187.0,125.0,215.0,205.0,213.0] },
      stpete: { name: 'St. Petersburg', lat: 27.8, lon: -82.6, consts: [0.165,0.052,0.027,0.162,0.146,0.053], phases: [54.5,64.8,48.2,334.6,326.8,333.0] }
    };
    const CONST_NAMES = ['M2','S2','N2','K1','O1','P1'];
    const SPEEDS = { M2:28.984104, S2:30.0, N2:28.43973, K1:15.041069, O1:13.943035, P1:14.958931 };

    // ---------- Scene Setup ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020812);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 16);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.maxPolarAngle = Math.PI/2.2;

    // Lighting
    scene.add(new THREE.AmbientLight(0x404060));
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(5,15,10);
    scene.add(dirLight);
    scene.add(new THREE.PointLight(0x446688, 0.6)).position.set(-10,5,10);

    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starsPos = new Float32Array(4000*3);
    for (let i=0; i<4000*3; i+=3) {
      const r = 80+Math.random()*120;
      const theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
      starsPos[i]=Math.sin(phi)*Math.cos(theta)*r;
      starsPos[i+1]=Math.sin(phi)*Math.sin(theta)*r;
      starsPos[i+2]=Math.cos(phi)*r;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos,3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0xffffff, size:0.08})));

    // Sun
    const sun = new THREE.Mesh(new THREE.SphereGeometry(2.5,32,16), new THREE.MeshStandardMaterial({color:0xffaa33, emissive:0xff5500, emissiveIntensity:1.5}));
    scene.add(sun);
    const sunLabel = new CSS2DObject(document.createElement('div'));
    sunLabel.element.textContent = '☀️ SUN';
    sunLabel.element.style.color = '#ffaa00'; sunLabel.element.style.fontWeight = 'bold';
    sunLabel.position.set(0, 3.5, 0);
    sun.add(sunLabel);

    // Earth
    const earth = new THREE.Mesh(new THREE.SphereGeometry(1.8, 64, 32), new THREE.MeshPhongMaterial({
      map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
      specularMap: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
      normalMap: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),
      specular: 0x333333, shininess:5
    }));
    scene.add(earth);
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.81,64,32), new THREE.MeshPhongMaterial({
      map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
      transparent:true, opacity:0.3, blending:THREE.AdditiveBlending
    }));
    earth.add(clouds);
    earth.rotation.z = -0.41;
    
    const earthLabel = new CSS2DObject(document.createElement('div'));
    earthLabel.element.textContent = '🌍 Earth';
    earthLabel.element.style.color = '#88ccff'; earthLabel.element.style.fontWeight = 'bold';
    earthLabel.position.set(0, 2.5, 0);
    earth.add(earthLabel);

    // Moon
    const moon = new THREE.Mesh(new THREE.SphereGeometry(0.6,24,12), new THREE.MeshStandardMaterial({color:0xcccccc, roughness:0.8}));
    scene.add(moon);
    const moonLabel = new CSS2DObject(document.createElement('div'));
    moonLabel.element.textContent = '🌙 Moon';
    moonLabel.element.style.color = '#dddddd';
    moonLabel.position.set(0, 1.2, 0);
    moon.add(moonLabel);

    // Orbits
    const earthOrbitR = 12, moonOrbitR = 4.5;
    const moonInc = 5.145*Math.PI/180;
    const earthOrbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([...Array(129)].map((_,i)=>new THREE.Vector3(Math.cos(i/128*Math.PI*2)*earthOrbitR,0,Math.sin(i/128*Math.PI*2)*earthOrbitR))), new THREE.LineBasicMaterial({color:0xccaa88}));
    const moonOrbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([...Array(129)].map((_,i)=>new THREE.Vector3(Math.cos(i/128*Math.PI*2)*moonOrbitR, Math.sin(i/128*Math.PI*2)*moonOrbitR*Math.sin(moonInc), Math.sin(i/128*Math.PI*2)*moonOrbitR*Math.cos(moonInc)))), new THREE.LineBasicMaterial({color:0x88aacc}));
    scene.add(earthOrbitLine, moonOrbitLine);

    // Station marker dot (child of Earth)
    const markerGeo = new THREE.SphereGeometry(0.18, 24);
    const markerMat = new THREE.MeshPhongMaterial({ color: 0xffaa00, emissive: new THREE.Color(0x442200) });
    const stationMarker = new THREE.Mesh(markerGeo, markerMat);
    earth.add(stationMarker); // attached to Earth

    // UI elements
    const stationSelect = document.getElementById('stationSelect');
    const datePicker = document.getElementById('datePicker');
    const timePicker = document.getElementById('timePicker');
    const setTimeBtn = document.getElementById('setTimeBtn');
    const playBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const speedSlider = document.getElementById('speedSlider');
    const clockDiv = document.getElementById('clock');
    const stationDisplay = document.getElementById('stationDisplay');
    const heightDisplay = document.getElementById('heightDisplay');
    
    let currentTime = new Date(Date.UTC(2025,0,1,0,0,0));
    let isPlaying = true;
    let speed = 1.0;
    let currentStationKey = 'sf';

    // Helper: compute tide height (meters)
    function computeTideHeight(stationKey, hoursFromRef) {
      const s = STATIONS[stationKey];
      let total = 0;
      CONST_NAMES.forEach((n, i) => {
        total += s.consts[i] * Math.cos((SPEEDS[n] * hoursFromRef - s.phases[i]) * Math.PI/180);
      });
      return total;
    }

    // Color mapping
    function getColorFromAmp(t) {
      if (t < 0.33) return new THREE.Color().lerpColors(new THREE.Color(0x0000ff), new THREE.Color(0x00ffff), t/0.33);
      if (t < 0.66) return new THREE.Color().lerpColors(new THREE.Color(0x00ffff), new THREE.Color(0xffff00), (t-0.33)/0.33);
      return new THREE.Color().lerpColors(new THREE.Color(0xffff00), new THREE.Color(0xff0000), (t-0.66)/0.34);
    }

    function updateMarker() {
      const s = STATIONS[currentStationKey];
      const latRad = s.lat * Math.PI/180;
      const lonRad = s.lon * Math.PI/180;
      const r = 1.86; // slightly above surface to avoid z-fighting
      const x = r * Math.cos(latRad) * Math.cos(lonRad);
      const y = r * Math.sin(latRad);
      const z = r * Math.cos(latRad) * Math.sin(lonRad);
      stationMarker.position.set(x, y, z);
      
      const refTime = new Date(Date.UTC(2025,0,1,0,0,0));
      const hoursSinceRef = (currentTime - refTime) / 3600000;
      const height = computeTideHeight(currentStationKey, hoursSinceRef);
      
      // Scale: base 0.18, add up to 0.5 for large tides
      const scale = 0.18 + Math.abs(height) * 0.12;
      stationMarker.scale.set(scale, scale, scale);
      
      const normAmp = Math.min(Math.abs(height) / 2.5, 1.0);
      stationMarker.material.color.set(getColorFromAmp(normAmp));
      
      stationDisplay.textContent = s.name;
      heightDisplay.textContent = height.toFixed(2);
    }

    function updateCelestial() {
      const days = (currentTime - new Date(Date.UTC(2025,0,1))) / 86400000;
      const earthAngle = (days / 365.25) * 2*Math.PI;
      const moonAngle = (days / 27.32) * 2*Math.PI;
      
      const earthX = Math.cos(earthAngle)*12, earthZ = Math.sin(earthAngle)*12;
      earth.position.set(earthX, 0, earthZ);
      
      const moonOffX = Math.cos(moonAngle)*4.5;
      const moonOffZ = Math.sin(moonAngle)*4.5*Math.cos(5.145*Math.PI/180);
      const moonOffY = Math.sin(moonAngle)*4.5*Math.sin(5.145*Math.PI/180);
      moon.position.set(earthX+moonOffX, moonOffY, earthZ+moonOffZ);
      moonOrbitLine.position.copy(earth.position);
      
      clouds.rotation.y += 0.002;
      earth.rotation.y += 0.001;
    }

    function updateClock() {
      clockDiv.textContent = `🕒 ${currentTime.toISOString().slice(0,10)} ${currentTime.toISOString().slice(11,19)} GMT`;
    }

    function refresh() {
      updateClock();
      updateCelestial();
      updateMarker();
    }

    // Event listeners
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
    });
    resetBtn.addEventListener('click', () => {
      currentTime = new Date(Date.UTC(2025,0,1,0,0,0));
      refresh();
    });
    setTimeBtn.addEventListener('click', () => {
      currentTime = new Date(`${datePicker.value}T${timePicker.value}Z`);
      refresh();
    });
    speedSlider.addEventListener('input', e => speed = parseFloat(e.target.value));
    stationSelect.addEventListener('change', (e) => {
      currentStationKey = e.target.value;
      refresh();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      if (isPlaying) {
        currentTime = new Date(currentTime.getTime() + 1000 * 60 * speed);
        refresh();
      }
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    refresh();
    animate();
  </script>
</body>
</html>
