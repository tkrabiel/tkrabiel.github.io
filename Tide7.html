<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 2D Tide Explorer · NOAA Stations Map</title>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1a2a3a;
      color: white;
      padding: 15px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      color: #aad0f5;
    }
    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    select, input, button {
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid #4a7a9c;
      background: #0e1e2b;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
    }
    button {
      background: #2a9d8f;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #21867a; }
    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
      min-height: 0;
    }
    .map-container {
      flex: 2;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid #2a4a6a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #map {
      height: 100%;
      width: 100%;
      background: #0a1a2a;
    }
    .sidebar {
      flex: 1;
      background: #0e1e2b;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid #2a4a6a;
      overflow-y: auto;
    }
    .station-info {
      margin-bottom: 20px;
    }
    .station-name {
      font-size: 1.4rem;
      font-weight: 500;
      color: #7fc4e4;
    }
    .tide-height {
      font-size: 2rem;
      font-weight: 600;
    }
    .chart-container {
      height: 200px;
      margin: 15px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 6px 4px;
      text-align: center;
      border-bottom: 1px solid #2a4a6a;
    }
    th { background: #1a3a4a; color: #b0d4f0; }
    .footnote {
      margin-top: 15px;
      color: #8aaac0;
      font-size: 0.8rem;
      text-align: center;
    }
    .clock {
      font-family: monospace;
      font-size: 1.2rem;
      background: #0a1a2a;
      padding: 6px 15px;
      border-radius: 40px;
    }
    .dot-legend {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
    }
    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: blue;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="header">
  <h1>🌊 2D Tide Explorer · NOAA Stations</h1>
  <div class="controls">
    <select id="stationSelect">
      <option value="sf">🌉 San Francisco</option>
      <option value="boston">⚓ Boston</option>
      <option value="anchorage">❄️ Anchorage</option>
      <option value="seattle">🌲 Seattle</option>
      <option value="portsmouth">🦞 Portsmouth, NH</option>
      <option value="portland">🦐 Portland, ME</option>
      <option value="galveston">🌴 Galveston, TX</option>
      <option value="sanjuan">🇵🇷 San Juan, PR</option>
      <option value="nyc">🗽 New York</option>
      <option value="stpete">🌴 St. Petersburg, FL</option>
    </select>
    <input type="date" id="datePicker" value="2025-01-01">
    <input type="time" id="timePicker" value="00:00">
    <button id="setTimeBtn">Set</button>
    <button id="playPauseBtn">⏸️ Pause</button>
    <button id="resetBtn">⟲ Jan 1</button>
    <div class="clock" id="clockDisplay">2025-01-01 00:00 GMT</div>
  </div>
</div>

<div class="main-content">
  <div class="map-container">
    <div id="map"></div>
  </div>
  <div class="sidebar">
    <div class="station-info">
      <div class="station-name" id="stationName">San Francisco</div>
      <div>Current tide height (MLLW):</div>
      <div class="tide-height" id="currentHeight">0.00 m</div>
      <div class="dot-legend">
        <span class="legend-dot" id="legendDot"></span>
        <span>Dot size & color = tide amplitude</span>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="tideChart"></canvas>
    </div>
    <h3 style="margin:10px 0 5px;">📋 High / Low tides</h3>
    <div style="overflow-x: auto;">
      <table id="tideTable">
        <thead><tr><th>Time (GMT)</th><th>Type</th><th>Height (m)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="footnote">
      ⏱️ Predictions based on harmonic constituents (M2,S2,N2,K1,O1,P1) · MLLW datum
    </div>
  </div>
</div>

<script>
  (function(){
    // ---------- Station database ----------
    const STATIONS = {
      sf:      { name: 'San Francisco', lat: 37.8, lon: -122.4, consts: [0.542,0.142,0.112,0.368,0.233,0.122], phases: [330.5,358.9,306.7,342.3,315.8,340.1] },
      boston:  { name: 'Boston', lat: 42.3, lon: -71.0, consts: [2.840,0.540,0.540,0.190,0.140,0.060], phases: [135.2,172.8,108.0,195.5,184.2,195.0] },
      anchorage:{ name: 'Anchorage', lat: 61.2, lon: -149.9, consts: [3.940,1.110,0.620,1.890,1.310,0.600], phases: [282.8,322.0,248.0,195.4,164.7,194.0] },
      seattle: { name: 'Seattle', lat: 47.6, lon: -122.3, consts: [0.961,0.231,0.199,0.523,0.323,0.171], phases: [222.5,247.3,195.6,230.4,211.2,229.1] },
      portsmouth:{ name: 'Portsmouth', lat: 43.1, lon: -70.7, consts: [2.680,0.510,0.510,0.180,0.130,0.055], phases: [142.5,178.0,115.0,200.0,188.0,198.0] },
      portland: { name: 'Portland', lat: 43.7, lon: -70.2, consts: [2.960,0.560,0.570,0.200,0.145,0.065], phases: [131.8,166.2,104.0,193.0,181.5,192.0] },
      galveston:{ name: 'Galveston', lat: 29.3, lon: -94.8, consts: [0.225,0.055,0.045,0.175,0.120,0.055], phases: [275.0,310.0,250.0,320.0,300.0,318.0] },
      sanjuan:  { name: 'San Juan', lat: 18.5, lon: -66.1, consts: [0.098,0.029,0.018,0.082,0.060,0.027], phases: [245.0,285.0,220.0,310.0,290.0,308.0] },
      nyc:      { name: 'New York', lat: 40.7, lon: -74.0, consts: [1.360,0.300,0.280,0.110,0.075,0.035], phases: [152.0,187.0,125.0,215.0,205.0,213.0] },
      stpete:   { name: 'St. Petersburg', lat: 27.8, lon: -82.6, consts: [0.165,0.052,0.027,0.162,0.146,0.053], phases: [54.5,64.8,48.2,334.6,326.8,333.0] }
    };
    const CONST_NAMES = ['M2','S2','N2','K1','O1','P1'];
    const SPEEDS = { M2:28.984104, S2:30.0, N2:28.43973, K1:15.041069, O1:13.943035, P1:14.958931 };
    
    // ---------- State ----------
    let currentStationKey = 'sf';
    let currentTime = new Date(Date.UTC(2025,0,1,0,0,0));
    let isPlaying = false;
    let speed = 1.0; // hours per real second (approx)
    let animationFrame = null;
    let chartInstance = null;
    
    // Leaflet map
    const map = L.map('map').setView([30, -40], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    
    // Station markers (all)
    const markers = {};
    // Custom marker with pulsing capability (we'll use a divIcon for size animation)
    function createPulsingMarker(lat, lon, stationKey) {
      const el = document.createElement('div');
      el.className = 'pulse-marker';
      el.style.width = '20px';
      el.style.height = '20px';
      el.style.borderRadius = '50%';
      el.style.backgroundColor = '#ffaa00';
      el.style.border = '2px solid white';
      el.style.boxShadow = '0 0 15px #ffaa00';
      el.style.transition = 'transform 0.2s, background-color 0.2s';
      
      const marker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: 'custom-marker',
          html: el.outerHTML,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(map);
      
      marker._icon = null; // we'll update manually
      marker.on('add', function() {
        const icon = this._icon;
        if (icon) {
          icon.style.transition = 'transform 0.2s, background-color 0.2s, width 0.2s, height 0.2s';
        }
      });
      
      return marker;
    }
    
    // Initialize all markers
    Object.keys(STATIONS).forEach(key => {
      const s = STATIONS[key];
      const marker = createPulsingMarker(s.lat, s.lon, key);
      marker.bindTooltip(s.name, { permanent: false });
      marker.on('click', () => {
        currentStationKey = key;
        document.getElementById('stationSelect').value = key;
        refreshAll();
      });
      markers[key] = marker;
    });
    
    // Highlight selected station marker
    function highlightSelectedMarker() {
      Object.entries(markers).forEach(([key, marker]) => {
        const el = marker.getElement();
        if (el) {
          if (key === currentStationKey) {
            el.style.border = '3px solid white';
            el.style.boxShadow = '0 0 20px #2a9d8f';
          } else {
            el.style.border = '2px solid white';
            el.style.boxShadow = '0 0 10px #aaa';
          }
        }
      });
    }
    
    // Compute tide height for given station and hours since 2025-01-01 00:00 GMT
    function computeTideHeight(stationKey, hoursFromRef) {
      const s = STATIONS[stationKey];
      let total = 0;
      CONST_NAMES.forEach((n, i) => {
        total += s.consts[i] * Math.cos((SPEEDS[n] * hoursFromRef - s.phases[i]) * Math.PI/180);
      });
      return total;
    }
    
    // Find high/low extrema over a window
    function findExtrema(stationKey, startHours, endHours, step = 0.1) {
      const values = [];
      for (let h = startHours; h <= endHours; h += step) {
        values.push({ h, v: computeTideHeight(stationKey, h) });
      }
      const extrema = [];
      for (let i = 2; i < values.length - 2; i++) {
        const prev2 = values[i-2].v, prev1 = values[i-1].v, curr = values[i].v, next1 = values[i+1].v, next2 = values[i+2].v;
        if (curr > prev1 && curr > next1 && curr >= prev2 && curr >= next2) {
          extrema.push({ type: 'H', time: values[i].h, value: curr });
        }
        if (curr < prev1 && curr < next1 && curr <= prev2 && curr <= next2) {
          extrema.push({ type: 'L', time: values[i].h, value: curr });
        }
      }
      return extrema.sort((a,b) => a.time - b.time);
    }
    
    // Update marker size/color based on tide height
    function updateMarkerAppearance() {
      const ref = new Date(Date.UTC(2025,0,1,0,0,0));
      const hours = (currentTime - ref) / 3600000;
      
      Object.entries(markers).forEach(([key, marker]) => {
        const height = computeTideHeight(key, hours);
        const absH = Math.abs(height);
        // Scale between 12px and 40px
        const size = Math.min(40, Math.max(12, 16 + absH * 8));
        // Color: blue (low) to red (high)
        const t = Math.min(absH / 3.0, 1.0);
        let color;
        if (t < 0.33) color = `hsl(${240 - t*120}, 80%, 60%)`;
        else if (t < 0.66) color = `hsl(${120 - (t-0.33)*120}, 80%, 60%)`;
        else color = `hsl(${0 + (t-0.66)*40}, 90%, 60%)`;
        
        const el = marker.getElement();
        if (el) {
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.backgroundColor = color;
          el.style.marginLeft = (-size/2) + 'px';
          el.style.marginTop = (-size/2) + 'px';
        }
      });
      highlightSelectedMarker();
    }
    
    // Update UI: clock, chart, table, current height
    function updateUI() {
      const ref = new Date(Date.UTC(2025,0,1,0,0,0));
      const hoursNow = (currentTime - ref) / 3600000;
      
      // Clock
      document.getElementById('clockDisplay').textContent = 
        currentTime.toISOString().slice(0,10) + ' ' + currentTime.toISOString().slice(11,19) + ' GMT';
      
      const s = STATIONS[currentStationKey];
      document.getElementById('stationName').textContent = s.name;
      const curHeight = computeTideHeight(currentStationKey, hoursNow);
      document.getElementById('currentHeight').textContent = curHeight.toFixed(2) + ' m';
      
      // Update chart (48h window centered on current time)
      const labels = [];
      const heights = [];
      const startH = hoursNow - 24;
      const endH = hoursNow + 24;
      for (let h = startH; h <= endH; h += 0.5) {
        heights.push(computeTideHeight(currentStationKey, h));
        const d = new Date(ref.getTime() + h * 3600000);
        labels.push(d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'GMT' }));
      }
      
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('tideChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Water level (m)',
            data: heights,
            borderColor: '#2a9d8f',
            backgroundColor: 'rgba(42,157,143,0.1)',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.2,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { maxTicksLimit: 8 }, grid: { color: '#3a5a6a' } },
            y: { grid: { color: '#3a5a6a' } }
          }
        }
      });
      
      // Table of extrema (next 48h)
      const extrema = findExtrema(currentStationKey, hoursNow, hoursNow + 48, 0.1);
      const tbody = document.querySelector('#tideTable tbody');
      tbody.innerHTML = '';
      extrema.slice(0, 12).forEach(e => {
        const d = new Date(ref.getTime() + e.time * 3600000);
        const timeStr = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'GMT' }) + ' ' + d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit'});
        const row = `<tr><td>${timeStr}</td><td>${e.type === 'H' ? '🔴 High' : '🔵 Low'}</td><td>${e.value.toFixed(2)}</td></tr>`;
        tbody.innerHTML += row;
      });
    }
    
    function refreshAll() {
      updateMarkerAppearance();
      updateUI();
    }
    
    // Animation step
    function step() {
      if (isPlaying) {
        currentTime = new Date(currentTime.getTime() + 1000 * 60 * speed); // advance minutes
        refreshAll();
      }
      animationFrame = requestAnimationFrame(step);
    }
    
    // Event listeners
    document.getElementById('stationSelect').addEventListener('change', e => {
      currentStationKey = e.target.value;
      refreshAll();
      map.setView([STATIONS[currentStationKey].lat, STATIONS[currentStationKey].lon], 5);
    });
    
    document.getElementById('setTimeBtn').addEventListener('click', () => {
      const date = document.getElementById('datePicker').value;
      const time = document.getElementById('timePicker').value;
      currentTime = new Date(`${date}T${time}Z`);
      refreshAll();
    });
    
    document.getElementById('playPauseBtn').addEventListener('click', function() {
      isPlaying = !isPlaying;
      this.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
    });
    
    document.getElementById('resetBtn').addEventListener('click', () => {
      currentTime = new Date(Date.UTC(2025,0,1,0,0,0));
      document.getElementById('datePicker').value = '2025-01-01';
      document.getElementById('timePicker').value = '00:00';
      refreshAll();
    });
    
    // Speed slider? Could add later, default speed 1.0 (60x realtime? we'll use 1 minute per step)
    // Start animation
    refreshAll();
    step();
    
    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
    });
    
    // Initial marker appearance
    setTimeout(() => highlightSelectedMarker(), 100);
  })();
</script>
</body>
</html>
