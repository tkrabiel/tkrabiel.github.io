
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NSPS Master Application Editor</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; margin: 0; }
        .main-wrapper { display: flex; transition: margin-right 0.3s; }
        .container { flex-grow: 1; max-width: 1000px; margin: auto; transition: 0.3s; }
        
        .controls { 
            position: sticky; top: 0; background: white; padding: 15px; 
            border: 2px solid #333; z-index: 1000; display: flex; gap: 10px; 
            margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; align-items: center;
        }
        .card { background: white; padding: 30px; border: 1px solid #000; margin-bottom: 20px; }
        h2 { text-align: center; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 10px; }
        
        .engagement-block { border: 2px solid #004a99; margin-top: 30px; background: #fff; position: relative;}
        .engagement-header { 
            background: #004a99; color: white; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-weight: bold;
        }
        .educational-bg .engagement-header { background: #2c3e50; }
        .educational-bg { border-color: #2c3e50; }

        .row { display: flex; gap: 20px; margin-bottom: 15px; padding: 0 15px; }
        .col { flex: 1; }
        .table-box { border: 1px solid #999; padding: 10px; flex: 1; background: #fdfdfd; }
        .box-title { font-weight: bold; background: #eee; display: block; padding: 5px; margin: -10px -10px 10px -10px; border-bottom: 1px solid #999; text-align: center; font-size: 12px; }
        label { display: block; font-weight: bold; font-size: 11px; margin-top: 8px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 6px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit; }
        
        .btn { padding: 10px 12px; cursor: pointer; border: none; font-weight: bold; color: white; border-radius: 4px; text-decoration: none; text-align: center; font-size: 12px; }
        .btn-home { background: #6c757d; }
        .btn-add { background: #28a745; }
        .btn-save { background: #004a99; }
        .btn-upload { background: #555; }
        .btn-export { background: #e67e22; }
        .btn-comp { background: #8e44ad; }
        .btn-delete { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .btn-tracker { background: #343a40; margin-left: auto; border: 2px solid #ffc107; color: #ffc107; }

        /* Dropdown Styles */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { 
            display: none; position: absolute; background-color: #fff; min-width: 200px; 
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 2000; border-radius: 4px; 
            overflow: hidden; top: 100%; left: 0; margin-top: 5px; border: 1px solid #ccc;
        }
        .dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; font-size: 12px; font-weight: bold; border-bottom: 1px solid #eee;}
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f1f1f1; color: #004a99; }
        .show { display: block; }

        /* Autocomplete Dropdown Styles */
        .autocomplete-container { position: relative; }
        .autocomplete-items { position: absolute; border: 1px solid #004a99; border-radius: 4px; background-color: #fff; z-index: 9999; max-height: 250px; overflow-y: auto; width: 100%; box-shadow: 0 8px 16px rgba(0,0,0,0.2); font-size: 13px; }
        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .autocomplete-items div:hover { background-color: #004a99; color: #ffffff; }
        .autocomplete-items strong { color: #d35400; }
        .autocomplete-items div:hover strong { color: #ffd54f; }

        /* Tracker Sidebar Styles */
        #trackerPanel {
            position: fixed; top: 0; right: -350px; width: 350px; height: 100vh;
            background: #fff; box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease; z-index: 2000; display: flex; flex-direction: column;
            border-left: 4px solid #004a99;
        }
        #trackerPanel.open { right: 0; }
        .tracker-header { background: #004a99; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .tracker-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .tracker-progress-container { padding: 15px; border-bottom: 1px solid #eee; background: #f8f9fa; }
        .progress-bar-bg { background: #ddd; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { background: #28a745; height: 100%; width: 0%; transition: width 0.4s ease; }
        .tracker-list { flex-grow: 1; overflow-y: auto; padding: 15px; font-size: 13px; }
        .missing-item { padding: 8px; border-bottom: 1px solid #eee; color: #dc3545; }
        .missing-item strong { color: #333; }
    </style>
</head>
<body>

<script src="competency_data.js"></script>

<div class="main-wrapper">
    <div class="container" id="mainContainer">
        <div class="controls">
            <a href="index.html" class="btn btn-home">HOME</a>
            <button class="btn btn-add" onclick="addProjectEngagement()">+ Add Project</button>
            
            <div class="dropdown">
                <button onclick="toggleEduDropdown()" class="btn btn-add dropbtn">+ Add Education ▼</button>
                <div id="eduDropdown" class="dropdown-content">
                    <a href="#" onclick="addEducationalEngagement()">📄 Blank Education</a>
                    <a href="#" onclick="addKnownEducation('UNH')">🎓 UNH CAT-A</a>
                    <a href="#" onclick="addKnownEducation('USM')">🎓 USM CAT-A</a>
                    <a href="#" onclick="addKnownEducation('CATB')">🎓 IHO CAT-B (Generic)</a>
                </div>
            </div>

            <button class="btn btn-save" onclick="saveAllToJSON()">Save JSON</button>
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">Load JSON</button>
            <a href="export.html" class="btn btn-export">EXPORT</a>
            <a href="competency_form.html" class="btn btn-comp">COMPETENCY FORM</a>
            
            <button class="btn btn-tracker" onclick="toggleTracker()">📋 TOGGLE TRACKER</button>

            <input type="file" id="fileInput" hidden accept=".json" onchange="loadFromJSON(event)">
        </div>

        <div class="card">
            <h2>Applicant Information</h2>
            <div class="row">
                <div class="col"><label>Full Name:</label><input type="text" id="master_name"></div>
                <div class="col"><label>Email:</label><input type="text" id="email"></div>	
                <div class="col">
                    <label>Level Seeking:</label>
                    <select id="master_level" onchange="updateTracker()">
                        <option value="Level I">Level I (S-5A)</option>
                        <option value="Level II" selected>Level II (S-5B)</option>
                    </select>
                </div>
            </div>
            <p style="font-size: 13px; color: #666; margin-top: 15px; text-align: center;">
                <em>Tip: While typing in Project Descriptions or Responsibilities, type <strong>@</strong> to auto-search and insert competency IDs.</em>
            </p>
        </div>

        <div id="engagement-list"></div>
    </div>

    <div id="trackerPanel">
        <div class="tracker-header">
            <span>Competency Tracker</span>
            <button class="tracker-close" onclick="toggleTracker()">×</button>
        </div>
        <div class="tracker-progress-container">
            <strong id="tracker-status-text">0 / 0 Completed</strong>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="tracker-progress-fill"></div>
            </div>
        </div>
        <div class="tracker-list">
            <h4 style="margin-top:0; color: #004a99;">Missing Competencies:</h4>
            <div id="tracker-missing-list">
                </div>
        </div>
    </div>
</div>

<script>
let counter = 0;

// --- DROPDOWN LOGIC ---
function toggleEduDropdown() {
    document.getElementById("eduDropdown").classList.toggle("show");
}

// Close the dropdown if the user clicks outside of it
window.onclick = function(event) {
    if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        for (var i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}

function addKnownEducation(schoolType) {
    // Determine which level of tags to load based on the applicant's selected level
    const levelSelect = document.getElementById('master_level'); 
    const levelKey = levelSelect.value === "Level I" ? "S5A" : "S5B";
    
    // Programmatically pull ALL competencies for that level and format them as tags
    const allTags = masterData[levelKey]
        .filter(item => item.type === "I") // Only get actionable IDs, not headers
        .map(item => `@${item.id} []`)
        .join("\n");

    let data = {};
    if (schoolType === 'UNH') {
        data = { f_name: "University of New Hampshire", j_title: "IHO CAT-A Certificate Program", j_cert: "IHO CAT-A", j_proj: allTags };
    } else if (schoolType === 'USM') {
        data = { f_name: "University of Southern Mississippi", j_title: "IHO CAT-A Certificate Program", j_cert: "IHO CAT-A", j_proj: allTags };
    } else if (schoolType === 'CATB') {
        data = { f_name: "Generic Institution", j_title: "IHO CAT-B Certificate Program", j_cert: "IHO CAT-B", j_proj: allTags };
    }
    
    addEducationalEngagement(data);
    
    // Ensure dropdown closes
    document.getElementById("eduDropdown").classList.remove("show");
}

// --- TRACKER LOGIC ---
function toggleTracker() {
    const panel = document.getElementById('trackerPanel');
    const container = document.getElementById('mainContainer');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')) {
        container.style.marginRight = '370px'; 
        updateTracker(); 
    } else {
        container.style.marginRight = 'auto';
    }
}

function updateTracker() {
    if(!document.getElementById('trackerPanel').classList.contains('open')) return;

    const levelSelect = document.getElementById('master_level'); 
    const levelKey = levelSelect.value === "Level I" ? "S5A" : "S5B";
    const dataList = masterData[levelKey] || masterData["S5B"];
    
    const requiredItems = dataList.filter(item => item.type === "I");
    const total = requiredItems.length;
    
    let allText = "";
    document.querySelectorAll('.engagement-block').forEach(block => {
        const fields = ['.j_proj', '.j_resp', '.j_comments', '.j_title'];
        fields.forEach(f => {
            const el = block.querySelector(f);
            if(el) allText += " " + el.value;
        });
    });
    
    const regex = /@([A-Za-z0-9.]+)\s*\[/g;
    let match;
    const foundRaw = new Set();
    while ((match = regex.exec(allText)) !== null) {
        foundRaw.add(match[1].toLowerCase()); 
    }
    
    let completed = [];
    let missing = [];
    requiredItems.forEach(item => {
        if(foundRaw.has(item.id.toLowerCase())) {
            completed.push(item);
        } else {
            missing.push(item);
        }
    });
    
    const percentage = total === 0 ? 0 : Math.round((completed.length / total) * 100);
    document.getElementById('tracker-progress-fill').style.width = percentage + '%';
    document.getElementById('tracker-status-text').innerText = `${completed.length} / ${total} Completed (${percentage}%)`;
    
    if (missing.length === 0) {
        document.getElementById('tracker-missing-list').innerHTML = "<div style='color:green; font-weight:bold;'>All competencies completed!</div>";
    } else {
        const missingHtml = missing.map(m => `<div class="missing-item"><strong>${m.id}</strong>: ${m.desc}</div>`).join('');
        document.getElementById('tracker-missing-list').innerHTML = missingHtml;
    }
}

// --- MATH ENGINE ---
function calculateMonths(d1, d2) {
    if (!d1 || !d2) return 0;
    const start = new Date(d1);
    const end = new Date(d2);
    let months = (end.getFullYear() - start.getFullYear()) * 12;
    months += end.getMonth() - start.getMonth();
    if (end.getDate() < start.getDate()) months--;
    return Math.max(0, months);
}

function calculateDuration(element) {
    const block = element.closest('.engagement-block');
    if (!block) return;
    
    const fromVal = block.querySelector('.d_from').value;
    const toVal = block.querySelector('.d_to').value;
    const displaySpan = block.querySelector('.duration-display');

    if (!fromVal || !toVal) return;

    const totalMonths = calculateMonths(fromVal, toVal);
    if (displaySpan) displaySpan.innerText = totalMonths;

    const numInputs = block.querySelectorAll('input[type="number"]');
    numInputs.forEach(input => {
        input.max = totalMonths;
        input.onchange = function() {
            if (parseInt(this.value) > totalMonths) {
                alert(`Error: Value cannot exceed the total duration (${totalMonths} months).`);
                this.value = totalMonths;
            }
        };
    });
}

function autoExpand(textarea) {
    textarea.style.height = 'inherit';
    const computed = window.getComputedStyle(textarea);
    const height = textarea.scrollHeight + 
                   parseInt(computed.getPropertyValue('border-top-width')) + 
                   parseInt(computed.getPropertyValue('border-bottom-width'));
    textarea.style.height = height + 'px';
}

// --- FORM BUILDERS ---
function addEducationalEngagement(data = null) {
    counter++;
    const list = document.getElementById('engagement-list');
    const id = counter;

    const template = `
        <div class="engagement-block educational-bg" id="eng_${id}" data-type="EE">
            <div class="engagement-header">
                <span>EDUCATIONAL ENGAGEMENT DETAIL # <span class="display_e_number">${id}</span></span>
                <button class="btn btn-delete" onclick="removeEng(this)">Remove Engagement</button>
            </div>
            
            <div class="inner-padding" style="padding: 15px;">
                <div class="row">
                    <div class="table-box">
                        <span class="box-title">INSTITUTION</span>
                        <label>Name:</label> <input type="text" class="f_name" value="${data?.f_name || ''}">
                        <label>Address:</label> <input type="text" class="f_addr" value="${data?.f_addr || ''}">
                        <label>Email:</label> <input type="email" class="f_email" value="${data?.f_email || ''}">
                        <label>Telephone:</label> <input type="text" class="f_tel" value="${data?.f_tel || ''}">
                    </div>
                    <div class="table-box">
                        <span class="box-title">CONTACT</span>
                        <label>Name:</label> <input type="text" class="s_name" value="${data?.s_name || ''}">
                        <label>Address:</label> <input type="text" class="s_addr" value="${data?.s_addr || ''}">
                        <label>Email:</label> <input type="email" class="s_email" value="${data?.s_email || ''}">
                        <label>Telephone:</label> <input type="text" class="s_tel" value="${data?.s_tel || ''}">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>From Date:</label> 
                        <input type="date" class="d_from" value="${data?.d_from || ''}" onchange="calculateDuration(this)">
                    </div>
                    <div class="col">
                        <label>To Date:</label> 
                        <input type="date" class="d_to" value="${data?.d_to || ''}" onchange="calculateDuration(this)">
                    </div>
                </div>

                <div class="row">
                    <div class="col" style="background: #e9ecef; padding: 10px; border-radius: 4px; margin: 10px 15px;">
                        <label style="margin:0; display:inline-block;">TOTAL MONTHS:</label>
                        <span class="duration-display" style="font-size: 16px; font-weight: bold; color: #004a99; margin-left: 10px;">
                            ${data ? calculateMonths(data.d_from, data.d_to) : '0'}
                        </span>
                    </div>
                </div>

                <div class="row">
                    <div class="col"><label>Detail of any breaks or gaps during this period:</label> 
                    <textarea class="d_gaps" rows="1" oninput="autoExpand(this)" style="overflow:hidden; resize:none; min-height: 30px;">${data?.d_gaps || ''}</textarea></div>
                </div>

                <div class="row">
                    <div class="col"><label>Program Title:</label> 
                    <textarea class="j_title" rows="1" oninput="autoExpand(this)" style="overflow:hidden; resize:none; min-height: 30px;">${data?.j_title || ''}</textarea></div>
                </div>
                <div class="row">
		            <div class="col"><label>Certificate Awarded:</label> 
                    <textarea class="j_cert" rows="1" oninput="autoExpand(this)" style="overflow:hidden; resize:none; min-height: 30px;">${data?.j_cert || ''}</textarea></div>
                </div>
                <div class="row">
                    <div class="col"><label>Detailed Description of Program (Type @ to search competencies):</label> 
                    <textarea class="j_proj" rows="1" oninput="autoExpand(this)" style="overflow:hidden; resize:none; min-height: 30px;">${data?.j_proj || ''}</textarea></div>
                </div>
                <div class="row">
                    <div class="col"><label>Additional Comments:</label> 
                    <textarea class="j_comments" rows="1" oninput="autoExpand(this)" style="overflow:hidden; resize:none; min-height: 30px;">${data?.j_comments || ''}</textarea></div>
                </div>
                <div class="row">
                    <div class="table-box">
                        <div class="col"><label>Non-Related or Education:</label> <input type="number" class="Edu_number" min="0" value="${data?.Edu_number || ''}"></div>
                        <div class="col"><label>Surveying, Engineering, Not Hydrography:</label> <input type="number" class="not_hydro_eng" min="0" value="${data?.not_hydro_eng || ''}"></div>
                    </div>                    
                </div>
            </div>
        </div>`;
    list.insertAdjacentHTML('beforeend', template);
    
 // Autoexpand all textareas after loading
    document.querySelectorAll('textarea').forEach(t => {
        if(t.value) autoExpand(t);
    });
    
    updateTracker(); 
}

// --- AUTOCOMPLETE @ LOGIC USING EXTERNAL competency_data.js ---
let currentMatchState = { active: false, startIndex: -1, textObj: null };

document.addEventListener('input', function(e) {
    if (e.target.tagName.toLowerCase() === 'textarea' || e.target.tagName.toLowerCase() === 'input') {
        updateTracker();
    }
    if (e.target.tagName.toLowerCase() === 'textarea') {
        handleAutocomplete(e.target);
    }
});

document.addEventListener('click', function(e) {
    if (!e.target.closest('.autocomplete-items')) closeDropdowns();
});

function handleAutocomplete(textarea) {
    const val = textarea.value;
    const cursorPos = textarea.selectionStart;
    const textBeforeCursor = val.substring(0, cursorPos);
    const match = textBeforeCursor.match(/@([a-zA-Z0-9.]*)$/);

    closeDropdowns();

    if (match) {
        currentMatchState = { active: true, startIndex: match.index, textObj: textarea };
        
        const levelSelect = document.getElementById('master_level'); 
        const levelKey = levelSelect.value === "Level I" ? "S5A" : "S5B";
        const searchStr = match[1].toLowerCase();
        const dataList = masterData[levelKey] || masterData["S5B"];
        
        const filtered = dataList.filter(item => 
            item.id && 
            item.type === "I" && 
            (item.id.toLowerCase().includes(searchStr) || item.desc.toLowerCase().includes(searchStr))
        );

        if (filtered.length > 0) showDropdown(textarea, filtered, searchStr);
    } else {
        currentMatchState.active = false;
    }
}

function showDropdown(textarea, list, searchStr) {
    if (window.getComputedStyle(textarea.parentNode).position === 'static') {
        textarea.parentNode.style.position = 'relative';
    }

    const dropdown = document.createElement("div");
    dropdown.setAttribute("class", "autocomplete-items");
    dropdown.style.top = (textarea.offsetTop + textarea.offsetHeight) + "px";
    dropdown.style.left = textarea.offsetLeft + "px";
    dropdown.style.width = textarea.offsetWidth + "px";
    
    list.forEach(item => {
        const div = document.createElement("div");
        const regex = new RegExp("(" + searchStr + ")", "gi");
        const displayId = item.id.replace(regex, "<strong>$1</strong>");
        
        div.innerHTML = `${displayId} - ${item.desc}`;
        div.addEventListener("click", function() { insertTag(item.id); });
        dropdown.appendChild(div);
    });

    textarea.parentNode.appendChild(dropdown);
}

function insertTag(id) {
    if (!currentMatchState.active) return;
    const textarea = currentMatchState.textObj;
    const val = textarea.value;
    const start = currentMatchState.startIndex;
    const end = textarea.selectionStart;
    
    const insertText = `@${id} [] `;
    textarea.value = val.substring(0, start) + insertText + val.substring(end);
    
    const newCursorPos = start + insertText.length - 2;
    textarea.focus();
    textarea.setSelectionRange(newCursorPos, newCursorPos);
    
    closeDropdowns();
    updateTracker(); 
}

function closeDropdowns() {
    const items = document.querySelectorAll(".autocomplete-items");
    items.forEach(item => item.parentNode.removeChild(item));
}

window.onload = function() {
    const transferData = localStorage.getItem('cst_data_transfer');
    if (transferData) {
        try {
            const parsedData = JSON.parse(transferData);
            populateForm(parsedData);
            localStorage.removeItem('cst_data_transfer');
        } catch (e) {
            console.error("Error parsing transferred data:", e);
            addProjectEngagement();
        }
    } else {
        addProjectEngagement();
    }
};
</script>

</body>
</html>
