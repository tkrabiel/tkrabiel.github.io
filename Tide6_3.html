<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌍🌕☀️ Tides on Earth · Amphidromic Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #020812;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(10, 30, 40, 0.8);
      padding: 16px 24px;
      border-radius: 40px;
      backdrop-filter: blur(8px);
      border-left: 4px solid #2a9d8f;
      pointer-events: none;
      z-index: 10;
    }
    #controls {
      position: absolute;
      bottom: 30px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      background: rgba(10, 30, 40, 0.7);
      padding: 15px 25px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      color: white;
      z-index: 20;
    }
    button {
      background: #1a7a8c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
      border: 1px solid #3a9bdc;
    }
    button:hover { background: #0f5e6f; }
    button.outline {
      background: transparent;
      border: 1.5px solid #2a9d8f;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] { width: 140px; }
    label { display: flex; align-items: center; gap: 8px; }
    #stats {
      position: absolute;
      bottom: 100px;
      right: 20px;
      color: #ccddee;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 15;
    }
    #note {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #aaccdd;
      background: rgba(0,20,30,0.6);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .colorbar {
      position: absolute;
      bottom: 120px;
      left: 20px;
      width: 200px;
      height: 20px;
      background: linear-gradient(to right, #0000ff, #00ffff, #ffff00, #ff0000);
      border-radius: 10px;
      border: 1px solid white;
      z-index: 30;
    }
    .colorbar-label {
      position: absolute;
      bottom: 145px;
      left: 20px;
      color: white;
      font-size: 12px;
      text-shadow: 1px 1px 2px black;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="info">
    <h1 style="margin:0 0 8px; font-weight:500;">🌍🌊 Tides on Earth · Amphidromic Systems</h1>
    <div id="dynamicInfo">Earth orbits Sun · Moon inclined 5.1° · M2 + S2</div>
  </div>
  <div id="note">🖱️ Drag to rotate · Scroll to zoom</div>
  <div id="stats">
    <span>⏱️ Time: <span id="timeDisplay">0.0 d</span> · Tidal Range: <span id="rangeDisplay">0.0 m</span> · <span id="tideType">Spring</span></span>
  </div>
  
  <div class="colorbar"></div>
  <div class="colorbar-label">← low amplitude &nbsp;&nbsp;&nbsp; high amplitude →</div>

  <div id="controls">
    <button id="playPauseBtn">⏸️ Pause</button>
    <button id="resetBtn" class="outline">⟲ Reset</button>
    <div class="slider-container">
      <span>⏩ Speed</span>
      <input type="range" id="speedSlider" min="0.0" max="3.0" step="0.1" value="1.0">
    </div>
    <label><input type="checkbox" id="showOrbitsCheck" checked> Show Orbits</label>
    <label><input type="checkbox" id="showCoRangeCheck" checked> Show Co‑range Lines</label>
    <label><input type="checkbox" id="showCelestialCheck" checked> Show Sun & Moon</label>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- Setup Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020812);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 22);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.target.set(0, 0, 0);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(5, 15, 10);
    scene.add(dirLight);
    const fillLight = new THREE.PointLight(0x446688, 0.6);
    fillLight.position.set(-10, 5, 10);
    scene.add(fillLight);
    
    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 4000;
    const starsPos = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
      const r = 80 + Math.random() * 120;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      starsPos[i] = Math.sin(phi) * Math.cos(theta) * r;
      starsPos[i+1] = Math.sin(phi) * Math.sin(theta) * r;
      starsPos[i+2] = Math.cos(phi) * r;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.08})));
    
    // --- Sun (center) ---
    const sun = new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 16), 
      new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: new THREE.Color(0xff5500), emissiveIntensity: 1.5 }));
    scene.add(sun);
    const sunLabel = new CSS2DObject(document.createElement('div'));
    sunLabel.element.textContent = '☀️ SUN';
    sunLabel.element.style.color = '#ffaa00';
    sunLabel.element.style.fontWeight = 'bold';
    sunLabel.position.set(0, 3.5, 0);
    sun.add(sunLabel);
    
    // --- Earth (will orbit Sun) ---
    const earth = new THREE.Mesh(new THREE.SphereGeometry(1.8, 64, 32),
      new THREE.MeshPhongMaterial({
        map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
        specularMap: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
        normalMap: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),
        specular: new THREE.Color('grey'), shininess: 5
      }));
    scene.add(earth);
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.81, 64, 32),
      new THREE.MeshPhongMaterial({ map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'), transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
    earth.add(clouds);
    earth.rotation.z = -0.41; // axial tilt
    
    const earthLabel = new CSS2DObject(document.createElement('div'));
    earthLabel.element.textContent = '🌍 Earth';
    earthLabel.element.style.color = '#88ccff';
    earthLabel.element.style.fontWeight = 'bold';
    earthLabel.position.set(0, 2.5, 0);
    earth.add(earthLabel);
    
    // --- Moon ---
    const moon = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 12),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 }));
    scene.add(moon);
    const moonLabel = new CSS2DObject(document.createElement('div'));
    moonLabel.element.textContent = '🌙 Moon';
    moonLabel.element.style.color = '#dddddd';
    moonLabel.position.set(0, 1.2, 0);
    moon.add(moonLabel);
    
    // --- Orbits (visual lines) ---
    const earthOrbitRadius = 12.0;
    const moonOrbitRadius = 4.5;
    const moonInclination = 5.145 * Math.PI/180;
    
    const earthOrbitPoints = [];
    const moonOrbitPoints = [];
    for (let i = 0; i <= 128; i++) {
      const angle = (i / 128) * Math.PI * 2;
      earthOrbitPoints.push(new THREE.Vector3(Math.cos(angle) * earthOrbitRadius, 0, Math.sin(angle) * earthOrbitRadius));
      const x = Math.cos(angle) * moonOrbitRadius;
      const z = Math.sin(angle) * moonOrbitRadius * Math.cos(moonInclination);
      const y = Math.sin(angle) * moonOrbitRadius * Math.sin(moonInclination);
      moonOrbitPoints.push(new THREE.Vector3(x, y, z));
    }
    const earthOrbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(earthOrbitPoints), new THREE.LineBasicMaterial({ color: 0xccaa88 }));
    const moonOrbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(moonOrbitPoints), new THREE.LineBasicMaterial({ color: 0x88aacc }));
    scene.add(earthOrbitLine);
    scene.add(moonOrbitLine);
    
    // --- Amphidromic Points (same as before) ---
    const amphidromicPoints = [
      { lon: -140, lat: 30, rot: 1 }, { lon: 160, lat: -20, rot: -1 }, { lon: -30, lat: 20, rot: 1 },
      { lon: 10, lat: -30, rot: -1 }, { lon: 80, lat: 0, rot: -1 }, { lon: -100, lat: -40, rot: 1 },
      { lon: 120, lat: 30, rot: -1 }, { lon: -50, lat: -10, rot: 1 }
    ];
    
    const gridRes = 36;
    const points = [];
    const amps = [], phases = [];
    for (let i = 0; i <= gridRes; i++) {
      const lat = -Math.PI/2 + (i/gridRes)*Math.PI;
      const numLon = Math.max(16, Math.floor(gridRes*2*Math.cos(lat)));
      for (let j = 0; j < numLon; j++) {
        const lon = (j/numLon)*Math.PI*2 - Math.PI;
        let totA=0, totP=0, totW=0;
        amphidromicPoints.forEach(ap => {
          const apl = ap.lat*Math.PI/180, aplo = ap.lon*Math.PI/180;
          const dLat = lat-apl, dLon = lon-aplo;
          const a = Math.sin(dLat/2)**2 + Math.cos(lat)*Math.cos(apl)*Math.sin(dLon/2)**2;
          const dist = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
          const amp = Math.min(3.0, dist*7.0);
          const bearing = Math.atan2(Math.sin(dLon)*Math.cos(lat), Math.cos(apl)*Math.sin(lat)-Math.sin(apl)*Math.cos(lat)*Math.cos(dLon));
          const phase = (bearing + ap.rot*dist*2.5) % (2*Math.PI);
          const w = Math.exp(-dist*1.8);
          totA += amp*w; totP += phase*w; totW += w;
        });
        const fa = totW>0?totA/totW:0, fp = totW>0?totP/totW:0;
        const x = Math.cos(lat)*Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat)*Math.sin(lon);
        points.push({pos: new THREE.Vector3(x,y,z)});
        amps.push(fa); phases.push(fp);
      }
    }
    
    // --- Tide visualization attached to Earth ---
    const earthGroup = new THREE.Group();
    earth.add(earthGroup);
    
    // Markers
    const markerGroup = new THREE.Group();
    const meshes = [];
    points.forEach((p, idx) => {
      if (amps[idx] < 0.05) return;
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6), new THREE.MeshPhongMaterial({transparent: true}));
      sphere.position.copy(p.pos.clone().multiplyScalar(1.85));
      markerGroup.add(sphere);
      meshes.push({mesh: sphere, amp: amps[idx], phase: phases[idx]});
    });
    earthGroup.add(markerGroup);
    
    // Co-range lines
    const coRangeGroup = new THREE.Group();
    amphidromicPoints.forEach(ap => {
      const apl = ap.lat*Math.PI/180, aplo = ap.lon*Math.PI/180;
      const ctr = new THREE.Vector3(Math.cos(apl)*Math.cos(aplo), Math.sin(apl), Math.cos(apl)*Math.sin(aplo));
      [0.6,1.2,1.8,2.4].forEach(r => {
        const pts = [];
        for (let i=0; i<=48; i++) {
          const ang = (i/48)*Math.PI*2;
          const east = new THREE.Vector3().crossVectors(ctr, new THREE.Vector3(0,1,0)).normalize();
          const north = new THREE.Vector3().crossVectors(east, ctr).normalize();
          const off = east.clone().multiplyScalar(Math.cos(ang)*r).add(north.clone().multiplyScalar(Math.sin(ang)*r));
          pts.push(ctr.clone().add(off).normalize().multiplyScalar(1.88));
        }
        coRangeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: 0x3a9bdc})));
      });
    });
    earthGroup.add(coRangeGroup);
    
    // Amphidromic markers
    const amphGroup = new THREE.Group();
    amphidromicPoints.forEach(ap => {
      const apl = ap.lat*Math.PI/180, aplo = ap.lon*Math.PI/180;
      const pos = new THREE.Vector3(Math.cos(apl)*Math.cos(aplo), Math.sin(apl), Math.cos(apl)*Math.sin(aplo)).multiplyScalar(1.9);
      amphGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.12,16), new THREE.MeshPhongMaterial({color: 0xff6666, emissive: new THREE.Color(0x440000)}))).position.copy(pos);
    });
    earthGroup.add(amphGroup);
    
    // --- UI ---
    const timeDisp = document.getElementById('timeDisplay');
    const rangeDisp = document.getElementById('rangeDisplay');
    const tideTypeSpan = document.getElementById('tideType');
    const playBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const speedSlider = document.getElementById('speedSlider');
    const showOrbits = document.getElementById('showOrbitsCheck');
    const showCoRange = document.getElementById('showCoRangeCheck');
    const showCelestial = document.getElementById('showCelestialCheck');
    
    let time = 0, isPlaying = true, speed = 1.0;
    const lunarPeriod = 27.32; // days
    const earthPeriod = 365.25; // days
    
    function getColor(amp) {
      const t = Math.min(amp/3.0, 1.0);
      if (t<0.33) return new THREE.Color().lerpColors(new THREE.Color(0x0000ff), new THREE.Color(0x00ffff), t/0.33);
      if (t<0.66) return new THREE.Color().lerpColors(new THREE.Color(0x00ffff), new THREE.Color(0xffff00), (t-0.33)/0.33);
      return new THREE.Color().lerpColors(new THREE.Color(0xffff00), new THREE.Color(0xff0000), (t-0.66)/0.34);
    }
    
    function update() {
      const moonAngle = (time / lunarPeriod) * 2 * Math.PI;
      const earthAngle = (time / earthPeriod) * 2 * Math.PI;
      
      // Earth position (orbits Sun)
      const earthX = Math.cos(earthAngle) * earthOrbitRadius;
      const earthZ = Math.sin(earthAngle) * earthOrbitRadius;
      earth.position.set(earthX, 0, earthZ);
      
      // Moon position (inclined orbit relative to Earth)
      const moonOffsetX = Math.cos(moonAngle) * moonOrbitRadius;
      const moonOffsetZ = Math.sin(moonAngle) * moonOrbitRadius * Math.cos(moonInclination);
      const moonOffsetY = Math.sin(moonAngle) * moonOrbitRadius * Math.sin(moonInclination);
      moon.position.set(earthX + moonOffsetX, moonOffsetY, earthZ + moonOffsetZ);
      
      moonOrbitLine.position.copy(earth.position);
      
      // Earth-relative directions for tide
      const toSun = new THREE.Vector3().subVectors(sun.position, earth.position).normalize();
      const toMoon = new THREE.Vector3().subVectors(moon.position, earth.position).normalize();
      const cosAng = toSun.dot(toMoon);
      const combFactor = Math.sqrt(1 + 0.46*0.46 + 2*0.46*cosAng);
      
      // Update tide markers (relative to Earth)
      meshes.forEach(m => {
        const h = m.amp * Math.cos((time * 24 / 12.42) * 2 * Math.PI - m.phase) * combFactor;
        m.mesh.material.color.set(getColor(Math.abs(h)*1.8));
        m.mesh.scale.setScalar(1 + Math.abs(h)*0.2);
      });
      
      rangeDisp.textContent = (Math.max(...amps)*combFactor).toFixed(2);
      timeDisp.textContent = time.toFixed(1);
      tideTypeSpan.textContent = cosAng > 0.8 ? '🌕 Spring' : (cosAng < -0.8 ? '🌓 Neap' : '↗️ Mixed');
      
      clouds.rotation.y += 0.005;
      earth.rotation.y += 0.002;
    }
    
    function animate() {
      requestAnimationFrame(animate);
      if (isPlaying) { time += 0.02 * speed; update(); }
      earthOrbitLine.visible = moonOrbitLine.visible = showOrbits.checked;
      coRangeGroup.visible = showCoRange.checked;
      sun.visible = moon.visible = showCelestial.checked;
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    
    playBtn.addEventListener('click', () => { isPlaying = !isPlaying; playBtn.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play'; });
    resetBtn.addEventListener('click', () => { time = 0; update(); });
    speedSlider.addEventListener('input', e => speed = parseFloat(e.target.value));
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    update();
    animate();
  </script>
</body>
</html>
