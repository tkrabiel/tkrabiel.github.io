<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Goats Song Puzzle</title>
    <style>
        :root {
            --bg: #1a1a24;
            --surface: #232334;
            --surface-light: #2c2c40;
            --text: #e4e0d7;
            --text-muted: #a09b8c;
            --accent: #d4a853;
            --accent-glow: #e8c97a;
            --danger: #c55858;
            --success: #6b9e6b;
            --badge-1: #f5ead0;
            --badge-2: #e8dcc8;
            --badge-3: #f0e5d2;
            --badge-4: #ede0cc;
            --badge-text: #2a2218;
            --border: #3a3a50;
            --radius: 12px;
            --radius-sm: 8px;
            --font-serif: 'Georgia', 'Times New Roman', 'Palatino Linotype', 'Book Antiqua', serif;
            --font-sans: 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(180, 140, 80, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(160, 120, 60, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(200, 160, 100, 0.02) 0%, transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--surface);
            border-radius: 20px;
            padding: 40px 36px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--border);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #b8944a, #d4a853, #c89e4f, #d4a853, #b8944a);
            border-radius: 20px 20px 0 0;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-icon {
            font-size: 42px;
            margin-bottom: 4px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .header h1 {
            font-family: var(--font-serif);
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--accent-glow);
            letter-spacing: 0.02em;
            margin: 0;
            line-height: 1.3;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }

        .words-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 12px;
            padding: 28px 16px;
            margin: 18px 0 24px;
            background: var(--surface-light);
            border-radius: 16px;
            border: 1px solid var(--border);
            min-height: 100px;
            align-items: center;
            position: relative;
        }

        .words-area.empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }

        .word-badge {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--badge-text);
            cursor: default;
            user-select: none;
            transition: transform var(--transition), box-shadow var(--transition);
            font-family: var(--font-serif);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .word-badge:nth-child(odd) {
            background: var(--badge-1);
            transform: rotate(-1.5deg);
        }
        .word-badge:nth-child(even) {
            background: var(--badge-2);
            transform: rotate(1.2deg);
        }
        .word-badge:nth-child(3n) {
            background: var(--badge-3);
            transform: rotate(-0.8deg);
        }
        .word-badge:nth-child(3n + 1) {
            background: var(--badge-4);
            transform: rotate(1.6deg);
        }
        .word-badge:nth-child(5n) {
            transform: rotate(-2deg);
        }

        .word-badge:hover {
            transform: rotate(0deg) scale(1.08);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        .guess-section {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .guess-input {
            flex: 1;
            min-width: 200px;
            padding: 13px 18px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--surface-light);
            color: var(--text);
            font-size: 1rem;
            font-family: var(--font-sans);
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        .guess-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(212, 168, 83, 0.1);
        }

        .guess-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .btn {
            padding: 13px 22px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1810;
            box-shadow: 0 4px 14px rgba(180, 140, 60, 0.3);
        }
        .btn-primary:hover {
            background: var(--accent-glow);
            box-shadow: 0 6px 20px rgba(200, 160, 70, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover {
            background: #35354a;
            border-color: #555570;
        }

        .btn-hint {
            background: transparent;
            color: var(--accent);
            border: 2px solid rgba(212, 168, 83, 0.35);
            font-size: 0.85rem;
            padding: 10px 16px;
        }
        .btn-hint:hover {
            background: rgba(212, 168, 83, 0.08);
            border-color: var(--accent);
        }

        .btn-giveup {
            background: transparent;
            color: var(--danger);
            border: 2px solid rgba(197, 88, 88, 0.3);
            font-size: 0.85rem;
            padding: 10px 16px;
        }
        .btn-giveup:hover {
            background: rgba(197, 88, 88, 0.08);
            border-color: var(--danger);
        }

        .feedback {
            text-align: center;
            min-height: 28px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
            transition: all var(--transition);
            line-height: 1.5;
        }

        .feedback.correct {
            color: var(--success);
            animation: popIn 0.4s ease-out;
        }
        .feedback.wrong {
            color: var(--danger);
            animation: shake 0.5s ease-out;
        }
        .feedback.info {
            color: var(--accent-glow);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            70% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-8px);
            }
            30% {
                transform: translateX(8px);
            }
            45% {
                transform: translateX(-6px);
            }
            60% {
                transform: translateX(5px);
            }
            75% {
                transform: translateX(-2px);
            }
            90% {
                transform: translateX(2px);
            }
        }

        .hint-display {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            min-height: 22px;
            font-style: italic;
            transition: all var(--transition);
        }

        .score-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .score-item {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .score-item span {
            display: block;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-glow);
            font-family: var(--font-serif);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-light);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            animation: toastIn 0.4s ease-out, toastOut 0.35s ease-in 2s forwards;
            pointer-events: none;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 28px 16px 24px;
                border-radius: 16px;
            }
            .container::before {
                border-radius: 16px 16px 0 0;
            }
            .header h1 {
                font-size: 1.35rem;
            }
            .word-badge {
                padding: 7px 12px;
                font-size: 0.8rem;
            }
            .words-area {
                gap: 7px 8px;
                padding: 18px 8px;
            }
            .guess-section {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                text-align: center;
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            .score-bar {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="header-icon">🐐</span>
            <h1>Mountain Goats<br>Song Puzzle</h1>
            <p class="subtitle">Identify the song from 10 random words</p>

            function extractWords(lyrics) {
                const rawWords = lyrics.split(/\s+/);
                const cleaned = rawWords.map(cleanWord).filter(w => w.length > 0);
                const unique = [...new Set(cleaned)].filter(isGoodWord);
                return unique;
            }

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function normalizeTitle(title) {
                let t = title.toLowerCase().trim();
                t = t.replace(/^the\s+/, '');
                t = t.replace(/^a\s+/, '');
                t = t.replace(/^an\s+/, '');
                // Remove punctuation for comparison
                t = t.replace(/[^a-z0-9\s]/g, '');
                t = t.replace(/\s+/g, ' ').trim();
                return t;
            }

            function showToast(message) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            // ─────────────────────────────────────
            // RENDER WORD BADGES
            // ─────────────────────────────────────
            function renderWords(words) {
                wordsArea.innerHTML = '';
                if (!words || words.length === 0) {
                    wordsArea.classList.add('empty-state');
                    wordsArea.innerHTML =
                        '<span style="color:var(--text-muted);font-style:italic;">Not enough words in this song. Try another.</span>';
                    return;
                }
                wordsArea.classList.remove('empty-state');
                words.forEach(word => {
                    const badge = document.createElement('span');
                    badge.className = 'word-badge';
                    badge.textContent = word;
                    wordsArea.appendChild(badge);
                });
            }

                     // ─────────────────────────────────────
            // PICK A RANDOM SONG & SET UP
            // ─────────────────────────────────────
            function pickNewSong() {
                const randomIndex = Math.floor(Math.random() * songs.length);
                currentSong = songs[randomIndex];
                const allWords = extractWords(currentSong.lyrics);

                if (allWords.length < 5) {
                    // Fallback: if too few words, try another song
                    const fallbackIndex = (randomIndex + 1) % songs.length;
                    currentSong = songs[fallbackIndex];
                    const fallbackWords = extractWords(currentSong.lyrics);
                    currentWords = shuffleArray(fallbackWords).slice(0, Math.min(10, fallbackWords.length));
                } else {
                    const shuffled = shuffleArray(allWords);
                    currentWords = shuffled.slice(0, Math.min(10, shuffled.length));
                }

                hintLevel = 0;
                guessCountThisSong = 0;
                revealed = false;
                renderWords(currentWords);
                guessInput.value = '';
                guessInput.disabled = false;
                submitBtn.disabled = false;
                hintBtn.disabled = false;
                giveUpBtn.disabled = false;
                feedback.textContent = '';
                feedback.className = 'feedback';
                hintDisplay.textContent = '';
                guessInput.focus();
            }

            // ─────────────────────────────────────
            // CHECK GUESS
            // ─────────────────────────────────────
            function checkGuess() {
                if (!currentSong || revealed) return;

                const rawGuess = guessInput.value.trim();
                if (!rawGuess) {
                    feedback.textContent = 'Please type a song title.';
                    feedback.className = 'feedback info';
                    return;
                }

                scoreAttempts++;
                guessCountThisSong++;
                updateScoreDisplay();

                const normalizedGuess = normalizeTitle(rawGuess);
                const normalizedAnswer = normalizeTitle(currentSong.title);

                if (normalizedGuess === normalizedAnswer) {
                    // CORRECT!
                    feedback.textContent = `🎉 Correct! "${currentSong.title}" from "${currentSong.album}"`;
                    feedback.className = 'feedback correct';
                    scoreCorrect++;
                    currentStreak++;
                    if (currentStreak > bestStreak) bestStreak = currentStreak;
                    updateScoreDisplay();
                    revealAnswer();
                    showToast('🎉 Correct! Great job!');
                    // Auto-focus input for potential new song
                    setTimeout(() => newSongBtn.focus(), 800);
                } else {
                    // WRONG
                    feedback.textContent = '❌ Not quite. Try again!';
                    feedback.className = 'feedback wrong';
                    currentStreak = 0;
                    updateScoreDisplay();
                    guessInput.value = '';
                    guessInput.focus();
                    // Shake the input
                    guessInput.style.animation = 'none';
                    guessInput.offsetHeight; // trigger reflow
                    guessInput.style.animation = 'shake 0.5s ease-out';
                    setTimeout(() => { guessInput.style.animation = ''; }, 500);
                }
            }

            function revealAnswer() {
                revealed = true;
                guessInput.disabled = true;
                submitBtn.disabled = true;
                hintBtn.disabled = true;
                giveUpBtn.disabled = true;
                feedback.textContent = `🎯 The answer: "${currentSong.title}" from "${currentSong.album}"`;
                feedback.className = 'feedback correct';
                hintDisplay.textContent = '';
            }

            function giveUp() {
                if (!currentSong || revealed) return;
                revealAnswer();
                currentStreak = 0;
                updateScoreDisplay();
                showToast(`The song was "${currentSong.title}"`);
            }

            function showHint() {
                if (!currentSong || revealed) return;
                hintLevel++;

                switch (hintLevel) {
                    case 1:
                        const wordCount = currentSong.title.split(/\s+/).length;
                        hintDisplay.textContent =
                            `💡 Hint: The song title has ${wordCount} word${wordCount > 1 ? 's' : ''}.`;
                        break;
                    case 2:
                        const initials = currentSong.title
                            .split(/\s+/)
                            .map(w => w.charAt(0).toUpperCase())
                            .join(' ');
                        hintDisplay.textContent = `💡 Hint: Title starts with: ${initials}`;
                        break;
                    case 3:
                        hintDisplay.textContent = `💡 Hint: This song appears on the album "${currentSong.album}".`;
                        break;
                    default:
                        hintDisplay.textContent =
                            `💡 Final hint: The title is "${currentSong.title.charAt(0).toUpperCase() + currentSong.title.slice(1)}".`;
                        break;
                }
            }

            function updateScoreDisplay() {
                scoreCorrectEl.textContent = scoreCorrect;
                scoreAttemptsEl.textContent = scoreAttempts;
                scoreStreakEl.textContent = currentStreak;
            }
  // ─────────────────────────────────────
            // EVENT LISTENERS
            // ─────────────────────────────────────
            submitBtn.addEventListener('click', checkGuess);
            guessInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkGuess();
                }
            });
            hintBtn.addEventListener('click', showHint);
            giveUpBtn.addEventListener('click', giveUp);
            newSongBtn.addEventListener('click', () => {
                pickNewSong();
                guessInput.focus();
            });

            // ─────────────────────────────────────
            // INITIALIZE
            // ─────────────────────────────────────
            pickNewSong();
            updateScoreDisplay();
            guessInput.focus();

            console.log('🐐 Mountain Goats Song Puzzle ready!');
            console.log(`   ${songs.length} songs loaded.`);
            console.log('   Guess the song from 10 random words from its lyrics.');
        })();
    </script>
</body>
</html>
