<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin Media Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .folder-tree { font-family: monospace; line-height: 1.4; }
        .result-card { transition: all 0.2s; }
        .result-card:hover { transform: scale(1.03); }
        .poster { width: 50px; height: 75px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-4xl font-semibold flex items-center gap-3">
                    <span class="text-[#00a4bd]">Jellyfin</span> Media Organizer
                </h1>
                <p class="text-gray-400 mt-1">Create perfect folder structures + READMEs • Powered by TMDB API</p>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <a href="https://jellyfin.org/docs/general/server/media/shows/" target="_blank" 
                   class="px-4 py-2 bg-gray-900 hover:bg-gray-800 rounded-xl flex items-center gap-2">
                    TV Shows
                </a>
                <a href="https://jellyfin.org/docs/general/server/media/movies/" target="_blank" 
                   class="px-4 py-2 bg-gray-900 hover:bg-gray-800 rounded-xl flex items-center gap-2">
                    Movies
                </a>
            </div>
        </div>

        <div class="bg-gray-900 rounded-3xl p-6 mb-8 border border-gray-800">
            <h2 class="text-lg font-medium mb-4 flex items-center gap-2">
                TMDB API Configuration
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">TheMovieDB (TMDB) API Key (v3)</label>
                    <input id="tmdb-key" type="password" placeholder="Paste your TMDB API key" 
                           class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#00a4bd]">
                </div>
                <div class="flex items-end">
                    <button onclick="saveApiKeysAndFetchConfig()" 
                            class="w-full bg-[#00a4bd] hover:bg-[#008a9e] text-white font-medium py-3 rounded-2xl text-sm">
                        Save Key + Load Image Config
                    </button>
                </div>
            </div>
            <div id="config-status" class="mt-4 text-xs"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 bg-gray-900 rounded-3xl p-8">
                <div class="mb-6">
                    <label class="block text-sm text-gray-400 mb-2">Media Type</label>
                    <div class="flex gap-2" id="type-buttons"></div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm text-gray-400 mb-2">Search Title</label>
                    <div class="flex gap-3">
                        <input id="search-input" type="text" placeholder="Search TMDB..." 
                               class="flex-1 bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                        <button onclick="performSearch()" 
                                class="bg-[#00a4bd] hover:bg-[#008a9e] px-8 rounded-2xl font-medium">Search</button>
                    </div>
                </div>

                <div id="search-results" class="mb-8 hidden"></div>

                <form id="media-form" onsubmit="generateStructure(event)">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Title</label>
                            <input id="title" type="text" required
                                   class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm text-gray-400 mb-2">Year</label>
                                <input id="year" type="text" placeholder="2024"
                                       class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-sm text-gray-400 mb-2">TMDB ID</label>
                                <input id="tmdb-id" type="text" placeholder="e.g. 1399"
                                       class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                            </div>
                        </div>

                        <div id="author-field" class="hidden">
                            <label class="block text-sm text-gray-400 mb-2">Author (books/audiobooks)</label>
                            <input id="author" type="text" placeholder="Andy Weir"
                                   class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                        </div>

                        <div id="seasons-field" class="hidden">
                            <label class="block text-sm text-gray-400 mb-2">Pre-create Seasons</label>
                            <input id="seasons" type="number" value="5" min="1" max="30"
                                   class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                        </div>

                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Base Output Directory</label>
                            <input id="output-dir" type="text" placeholder="/media/Jellyfin/Movies" value="/media/Jellyfin"
                                   class="w-full bg-gray-950 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#00a4bd]">
                        </div>

                        <button type="submit"
                                class="w-full py-5 bg-[#00a4bd] hover:bg-[#008a9e] rounded-3xl text-lg font-semibold mt-4">
                            Generate Structure
                        </button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-7">
                <div class="bg-gray-900 rounded-3xl p-8 h-full flex flex-col">
                    <h2 class="text-xl font-medium mb-6">Preview</h2>
                    
                    <div id="preview-tree" class="folder-tree bg-gray-950 border border-gray-700 rounded-2xl p-6 flex-1 overflow-auto text-sm mb-6"></div>

                    <div class="mt-auto">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-medium">README Preview</h3>
                        </div>
                        <pre id="readme-preview" class="bg-gray-950 border border-gray-700 rounded-2xl p-5 text-xs overflow-auto max-h-80 text-gray-300"></pre>
                    </div>
                </div>
            </div>
        </div>

        <div id="download-section" class="hidden mt-8 bg-gray-900 rounded-3xl p-8">
            <h3 class="font-medium mb-4">Ready to create folders on your computer?</h3>
            <div class="flex gap-4">
                <button onclick="downloadShellScript()" 
                        class="flex-1 py-4 border border-gray-700 hover:border-gray-400 rounded-2xl flex items-center justify-center gap-3">
                    📥 Download .sh (macOS / Linux)
                </button>
                <button onclick="downloadBatScript()" 
                        class="flex-1 py-4 border border-gray-700 hover:border-gray-400 rounded-2xl flex items-center justify-center gap-3">
                    📥 Download .bat (Windows)
                </button>
            </div>
        </div>
    </div>

    <script>
        function initTailwind() {
            tailwind.config = { content: [] }
        }

        let currentType = "tv"
        let tmdbKey = localStorage.getItem("tmdbKey") || ""
        let tmdbConfig = null   

        const mediaTypes = [
            { id: "tv", label: "📺 TV Show", value: "tv" },
            { id: "movie", label: "🎬 Movie", value: "movie" },
            { id: "audiobook", label: "🎧 Audiobook", value: "audiobook" },
            { id: "book", label: "📖 Book", value: "book" }
        ]

        function renderTypeButtons() {
            const container = document.getElementById("type-buttons")
            container.innerHTML = mediaTypes.map(type => `
                <button onclick="selectType('${type.value}')" 
                        class="flex-1 py-4 rounded-2xl font-medium transition-all ${currentType === type.value ? 'bg-[#00a4bd] text-white shadow-lg' : 'bg-gray-800 hover:bg-gray-700'}">
                    ${type.label}
                </button>
            `).join("")
        }

        function selectType(type) {
            currentType = type
            renderTypeButtons()
            document.getElementById("seasons-field").classList.toggle("hidden", type !== "tv")
            document.getElementById("author-field").style.display = (type === "audiobook" || type === "book") ? "block" : "none"
            document.getElementById("search-results").classList.add("hidden")
        }

        async function fetchTMDBConfig() {
            if (!tmdbKey) return false
            const statusEl = document.getElementById("config-status")
            statusEl.innerHTML = `<span class="text-amber-400">Loading TMDB configuration...</span>`
            
            try {
                const url = `https://api.themoviedb.org/3/configuration?api_key=${tmdbKey}`
                const res = await fetch(url)
                if (!res.ok) throw new Error("Failed")
                tmdbConfig = await res.json()
                statusEl.innerHTML = `<span class="text-emerald-400">✅ Config loaded successfully.</span>`
                return true
            } catch (e) {
                statusEl.innerHTML = `<span class="text-red-400">❌ Failed to verify API key.</span>`
                return false
            }
        }

        async function saveApiKeysAndFetchConfig() {
            tmdbKey = document.getElementById("tmdb-key").value.trim()
            if (!tmdbKey) return alert("Please enter a valid key")
            localStorage.setItem("tmdbKey", tmdbKey)
            await fetchTMDBConfig()
        }

        async function performSearch() {
            const query = document.getElementById("search-input").value.trim()
            if (!query || !tmdbKey) return alert("Missing title or API key")

            if (!tmdbConfig) await fetchTMDBConfig()

            const resultsContainer = document.getElementById("search-results")
            resultsContainer.innerHTML = `<p class="text-gray-400">Searching...</p>`
            resultsContainer.classList.remove("hidden")

            const mediaType = currentType === "tv" ? "tv" : "movie"
            const url = `https://api.themoviedb.org/3/search/${mediaType}?api_key=${tmdbKey}&query=${encodeURIComponent(query)}&language=en-US`

            try {
                const res = await fetch(url)
                const data = await res.json()

                if (data.results && data.results.length > 0) {
                    let html = `<div class="grid grid-cols-1 gap-3 max-h-80 overflow-auto pr-2">`
                    data.results.slice(0, 10).forEach(item => {
                        const title = item.title || item.name || "Untitled"
                        const year = (item.release_date || item.first_air_date || "").split("-")[0] || "—"
                        const posterPath = item.poster_path
                        let posterHTML = posterPath && tmdbConfig 
                            ? `<img src="${tmdbConfig.images.secure_base_url}w92${posterPath}" class="poster">`
                            : `<div class="w-12 h-16 bg-gray-700 rounded flex items-center justify-center text-xs text-gray-400">N/A</div>`

                        html += `
                            <div onclick='selectSearchResult(${JSON.stringify(item).replace(/'/g, "&apos;")})' 
                                 class="result-card cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-700 p-4 rounded-2xl flex gap-4 items-center">
                                ${posterHTML}
                                <div class="flex-1 min-w-0">
                                    <div class="font-medium truncate">${title}</div>
                                    <div class="text-xs text-gray-400">${year} • ID: ${item.id}</div>
                                    <div class="text-xs text-gray-400 line-clamp-2 mt-1">${item.overview || ""}</div>
                                </div>
                            </div>`
                    })
                    html += `</div>`
                    resultsContainer.innerHTML = html
                } else {
                    resultsContainer.innerHTML = `<p class="text-gray-400">No results found.</p>`
                }
            } catch (e) {
                resultsContainer.innerHTML = `<p class="text-red-400">Search error.</p>`
            }
        }

        function selectSearchResult(item) {
            document.getElementById("title").value = item.title || item.name || ""
            
            const year = (item.release_date || item.first_air_date || "").split("-")[0]
            if (year) document.getElementById("year").value = year
            
            // NEW: Capture the TMDB ID
            if (item.id) document.getElementById("tmdb-id").value = item.id
            
            document.getElementById("search-results").classList.add("hidden")
        }

        function generateStructure(e) {
            e.preventDefault()
            
            const title = document.getElementById("title").value.trim()
            if (!title) return alert("Title required")
            
            const year = document.getElementById("year").value.trim()
            const id = document.getElementById("tmdb-id").value.trim()
            const author = document.getElementById("author").value.trim()
            const seasons = currentType === "tv" ? parseInt(document.getElementById("seasons").value) || 5 : 0
            const outputDir = document.getElementById("output-dir").value.trim() || "/media/Jellyfin"
            
            // Smart Folder Naming with ID
            let folderName = title
            if (year) folderName += ` (${year})`
            if (id) folderName += ` [tmdbid-${id}]`
            
            let treeHTML = `<div class="text-emerald-400 font-medium">📁 ${folderName}</div>`
            
            if (currentType === "tv") {
                treeHTML += `<div class="ml-6">📁 Season 00</div>`
                for (let i = 1; i <= seasons; i++) {
                    treeHTML += `<div class="ml-6">📁 Season ${i.toString().padStart(2, '0')}</div>`
                }
            } else if (currentType === "movie") {
                // If it's a movie, the file itself should ideally match the folder name
                treeHTML += `<div class="ml-6 text-emerald-400">📄 ${folderName}.mkv</div>`
            } else if (currentType === "audiobook" || currentType === "book") {
                if (author) treeHTML = `<div class="text-emerald-400">📁 ${author}</div><div class="ml-6">📁 ${folderName}</div>`
                treeHTML += `<div class="ml-12 text-emerald-400">📄 ${folderName}.m4b</div>`
            }
            
            document.getElementById("preview-tree").innerHTML = treeHTML

            const readmeContent = generateREADME(title, year, id, author, currentType)
            document.getElementById("readme-preview").textContent = readmeContent

            window.lastGenerated = {
                type: currentType,
                folderName: folderName,
                seasons: seasons,
                outputDir: outputDir,
                readmeContent: readmeContent,
                author: author
            }
            
            document.getElementById("download-section").classList.remove("hidden")
        }

        function generateREADME(title, year, id, author, type) {
            let fullTitle = title
            if (year) fullTitle += ` (${year})`
            if (id) fullTitle += ` [tmdbid-${id}]`
            
            let content = `# Jellyfin Target: ${title}\n`
            if (id) content += `Metadata Provider ID: tmdbid-${id}\n`
            content += `\n`
            
            if (type === "tv") {
                content += `Episodes should be named: ${title} S01E01.mkv\n`
            } else if (type === "movie") {
                content += `Main file: ${fullTitle}.mkv\n`
            }
            return content
        }

        function downloadShellScript() {
            if (!window.lastGenerated) return
            const data = window.lastGenerated
            let script = `#!/bin/bash\nmkdir -p "${data.outputDir}/${data.folderName}"\ncd "${data.outputDir}/${data.folderName}"\n`
            
            if (data.type === "tv") {
                script += `mkdir -p "Season 00"\n`
                for (let i = 1; i <= data.seasons; i++) script += `mkdir -p "Season ${i.toString().padStart(2, '0')}"\n`
            }
            script += `cat > "README_Jellyfin_Naming.txt" << 'EOF'\n${data.readmeContent}\nEOF\n`
            
            const blob = new Blob([script], { type: "text/plain" })
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "create_folders.sh"; a.click()
        }

        function downloadBatScript() {
            if (!window.lastGenerated) return
            const data = window.lastGenerated
            let script = `@echo off\nmkdir "${data.outputDir}\\${data.folderName}" 2>nul\ncd /d "${data.outputDir}\\${data.folderName}"\n`
            
            if (data.type === "tv") {
                script += `mkdir "Season 00" 2>nul\n`
                for (let i = 1; i <= data.seasons; i++) script += `mkdir "Season ${i.toString().padStart(2, '0')}" 2>nul\n`
            }
            script += `echo ${data.readmeContent.replace(/\n/g, "^\n")} > README_Jellyfin_Naming.txt\n`
            
            const blob = new Blob([script], { type: "text/plain" })
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "create_folders.bat"; a.click()
        }

        window.onload = async function() {
            initTailwind(); renderTypeButtons(); selectType("tv")
            if (tmdbKey) {
                document.getElementById("tmdb-key").value = tmdbKey
                await fetchTMDBConfig()
            }
        }
    </script>
</body>
</html>
