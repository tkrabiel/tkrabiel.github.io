<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NSPS Master Application Editor</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        
        .controls { background: #333; padding: 15px 20px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; position: sticky; top: 10px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; }
        .controls a, .controls button { color: white; text-decoration: none; font-weight: bold; font-size: 13px; padding: 10px 15px; border-radius: 4px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-home { background: #6c757d; }
        .btn-export { background: #e67e22; }
        .btn-comp { background: #8e44ad; } 
        .btn-import { background: #17a2b8; } 
        .btn-add-pe { background: #004a99; }
        .btn-add-ee { background: #2c3e50; }
        .btn-save { background: #28a745; margin-left: auto; }

        .header-card { background: white; padding: 30px; border-radius: 8px; border-top: 4px solid #004a99; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header-card input, .header-card select { padding: 10px; font-size: 16px; width: 100%; max-width: 300px; margin-top: 10px; margin-right: 20px; border: 1px solid #ccc; border-radius: 4px; }

        .engagement-card { background: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; border-left: 4px solid #ccc; }
        .engagement-card.pe { border-left-color: #004a99; }
        .engagement-card.ee { border-left-color: #2c3e50; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 15px; background: #fdfdfd; padding: 15px; border: 1px solid #ddd; border-radius: 4px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .btn-remove { position: absolute; top: 20px; right: 20px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .duration-box { background: #e9ecef; padding: 15px; border-radius: 4px; margin-top: 15px; display: flex; align-items: center; border-left: 4px solid #004a99;}

        /* Autocomplete Dropdown Styles */
        .autocomplete-container { position: relative; }
        .autocomplete-items { position: absolute; border: 1px solid #004a99; border-radius: 4px; background-color: #fff; z-index: 9999; max-height: 250px; overflow-y: auto; width: 100%; box-shadow: 0 8px 16px rgba(0,0,0,0.2); font-size: 13px; }
        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .autocomplete-items div:hover { background-color: #004a99; color: #ffffff; }
        .autocomplete-items strong { color: #d35400; }
        .autocomplete-items div:hover strong { color: #ffd54f; }

    <div class="controls">
        <a href="index.html" class="btn-home">← HOME</a>

            </div>
            <div>
                <label style="font-weight:bold; display:block;">Certification Level Seeking</label>

                    <option value="Level I">Level 1 - CMH (S-5A)</option>
                    <option value="Level II" selected>Level 2 - CH (S-5B)</option>
                </select>
            </div>
        </div>
        <p style="font-size: 13px; color: #666; margin-top: 15px;">
            <em>Tip: While typing in any large text box below, type <strong>@</strong> to auto-search and insert competency IDs.</em>
        </p>
    </div>

    <div id="engagementsContainer">
        </div>

<script>
    let engagementCount = 0;

    // --- MATH & DURATION ENGINE ---
    function calculateMonths(d1, d2) {
        if (!d1 || !d2) return 0;
        const start = new Date(d1);
        const end = new Date(d2);
        let months = (end.getFullYear() - start.getFullYear()) * 12;
        months += end.getMonth() - start.getMonth();
        if (end.getDate() < start.getDate()) months--;
        return Math.max(0, months);
    }

    function calculateDuration(blockId) {
        const block = document.getElementById(blockId);
        const fromVal = block.querySelector('.d_from').value;
        const toVal = block.querySelector('.d_to').value;
        const displaySpan = document.getElementById(`duration_${blockId}`);

        if (!fromVal || !toVal) return;

        const totalMonths = calculateMonths(fromVal, toVal);
        if (displaySpan) displaySpan.innerText = totalMonths;

        // Restrict time allocation inputs from exceeding total months
        const numInputs = block.querySelectorAll('input[type="number"]');
        numInputs.forEach(input => {
            input.max = totalMonths;
            input.onchange = function() {
                if (parseInt(this.value) > totalMonths) {
                    alert(`Error: Value cannot exceed the total duration (${totalMonths} months).`);
                    this.value = totalMonths;
                }
            };
        });
    }

    // --- FORM BUILDER ---
    function addEngagement(type) {
        engagementCount++;
        const container = document.getElementById('engagementsContainer');
        const card = document.createElement('div');
        const id = engagementCount;
        
        card.className = `engagement-card ${type.toLowerCase()}`;
        card.id = `eng_${id}`;
        card.dataset.type = type;

        const isPE = type === 'PE';
        const title = isPE ? "Project Engagement (PE)" : "Educational Engagement (EE)";

        let html = `
            <button class="btn-remove" onclick="document.getElementById('${card.id}').remove()">Remove</button>
            <h3 style="margin-top:0; color: ${isPE ? '#004a99' : '#2c3e50'};">#<span class="eng-num">${id}</span> - ${title}</h3>
            
            <div class="grid-2">
                <div class="form-group"><label>${isPE ? 'Firm Name' : 'Institution Name'}</label><input type="text" class="f_name"></div>
                <div class="form-group"><label>${isPE ? 'Supervisor Name' : 'Contact Name'}</label><input type="text" class="s_name"></div>
                <div class="form-group"><label>Start Date (YYYY-MM-DD)</label><input type="date" class="d_from" onchange="calculateDuration('eng_${id}')"></div>
                <div class="form-group"><label>End Date (YYYY-MM-DD)</label><input type="date" class="d_to" onchange="calculateDuration('eng_${id}')"></div>
                <div class="form-group"><label>${isPE ? 'Job Title' : 'Program Title'}</label><input type="text" class="j_title"></div>
            </div>

            <div class="duration-box">
                <label style="margin:0; font-size: 14px;">TOTAL MONTHS:</label>
                <span id="duration_eng_${id}" style="font-size: 18px; font-weight: bold; color: #004a99; margin-left: 10px;">0</span>
            </div>

            <div class="form-group" style="margin-top:15px;"><label>Detail of any gaps or breaks during this period:</label><textarea class="d_gaps"></textarea></div>
        `;

        if (isPE) {
            html += `
                <div class="form-group"><label>Responsibilities & Duties (Type @ for Competency IDs)</label><textarea class="j_resp"></textarea></div>
                <div class="form-group"><label>Detailed Project Description (Type @ for Competency IDs)</label><textarea class="j_proj"></textarea></div>
                <div class="grid-2">
                    <div class="form-group"><label>Equipment Used</label><input type="text" class="j_equip"></div>
                    <div class="form-group"><label>Software Used</label><input type="text" class="j_soft"></div>
                </div>
                
                <h4 style="margin-bottom:0;">Time Allocation (Months)</h4>
                <div class="grid-3">
                    <div class="form-group"><label>Non-Related or Education:</label> <input type="number" class="Edu_number" min="0"></div>
                    <div class="form-group"><label>Surveying, Engineering, Not Hydro:</label> <input type="number" class="not_hydro_eng" min="0"></div>
                    <div class="form-group"><label>Hydrography (Total):</label> <input type="number" class="Hydro_time" min="0"></div>
                    <div class="form-group"><label>Hydrography in Field:</label> <input type="number" class="H_in_field" min="0"></div>
                    <div class="form-group"><label>Hydrography in Tech Charge:</label> <input type="number" class="H_charge" min="0"></div>
                </div>
            `;
        } else {
            html += `
                <div class="form-group"><label>Certificate/Degree Awarded</label><input type="text" class="j_cert"></div>
                <div class="form-group"><label>Detailed Description of Program (Type @ for Competency IDs)</label><textarea class="j_proj"></textarea></div>
                <div class="form-group"><label>Additional Comments</label><textarea class="j_comments"></textarea></div>
                
                <h4 style="margin-bottom:0;">Time Allocation (Months)</h4>
                <div class="grid-3">
                    <div class="form-group"><label>Education Time:</label> <input type="number" class="Edu_number" min="0"></div>
                    <div class="form-group"><label>Surveying/Engineering (Not Hydro):</label> <input type="number" class="not_hydro_eng" min="0"></div>
                </div>
            `;
        }

        html += `<input type="hidden" class="engagement_type" value="${type}">`;
        card.innerHTML = html;
        container.appendChild(card);
    }

    // --- JSON IMPORT/EXPORT ---
    function loadJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                
                if (json.applicant) document.getElementById('applicantName').value = json.applicant;
                if (json.level) document.getElementById('level').value = json.level;

                document.getElementById('engagementsContainer').innerHTML = '';
                engagementCount = 0;

                if (json.data && Array.isArray(json.data)) {
                    json.data.forEach(eng => {
                        const type = eng.engagement_type === 'EE' ? 'EE' : 'PE';
                        addEngagement(type);
                        
                        const card = document.getElementById(`eng_${engagementCount}`);
                        const setVal = (cls, val) => {
                            const el = card.querySelector(`.${cls}`);
                            if (el && val !== undefined) el.value = val;
                        };

                        setVal('f_name', eng.f_name); setVal('s_name', eng.s_name);
                        setVal('d_from', eng.d_from); setVal('d_to', eng.d_to);
                        setVal('j_title', eng.j_title); setVal('j_proj', eng.j_proj);
                        setVal('d_gaps', eng.d_gaps);
                        
                        setVal('Edu_number', eng.Edu_number);
                        setVal('not_hydro_eng', eng.not_hydro_eng);
                        
                        if (type === 'PE') {
                            setVal('j_resp', eng.j_resp); setVal('j_equip', eng.j_equip); setVal('j_soft', eng.j_soft);
                            setVal('Hydro_time', eng.Hydro_time); setVal('H_in_field', eng.H_in_field); setVal('H_charge', eng.H_charge);
                        } else {
                            setVal('j_cert', eng.j_cert); setVal('j_comments', eng.j_comments);
                        }
                        
                        // Recalculate math
                        calculateDuration(`eng_${engagementCount}`);
                    });
                }
                document.getElementById('jsonUpload').value = "";
                
            } catch (err) { alert("Error reading file."); }
        };
        reader.readAsText(file);
    }

    function saveJSON() {
        const applicant = document.getElementById('applicantName').value || "Unnamed_Applicant";
        const level = document.getElementById('level').value;
        const cards = document.querySelectorAll('.engagement-card');
        const data = [];

        cards.forEach((card, index) => {
            const getVal = (cls) => { const el = card.querySelector(`.${cls}`); return el ? el.value : ""; };
            const type = getVal('engagement_type');
            
            let entry = {
                e_number: (index + 1).toString(), 
                engagement_type: type,
                f_name: getVal('f_name'), s_name: getVal('s_name'),
                d_from: getVal('d_from'), d_to: getVal('d_to'),
                d_gaps: getVal('d_gaps'), j_title: getVal('j_title'),
                j_proj: getVal('j_proj'),
                Edu_number: getVal('Edu_number'), not_hydro_eng: getVal('not_hydro_eng')
            };

            if (type === 'PE') {
                entry.j_resp = getVal('j_resp'); entry.j_equip = getVal('j_equip'); entry.j_soft = getVal('j_soft');
                entry.Hydro_time = getVal('Hydro_time'); entry.H_in_field = getVal('H_in_field'); entry.H_charge = getVal('H_charge');
            } else {
                entry.j_cert = getVal('j_cert'); entry.j_comments = getVal('j_comments');
            }
            data.push(entry);
        });

        const finalJSON = { applicant, level, data };
        const blob = new Blob([JSON.stringify(finalJSON, null, 4)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `CST_Application_${applicant.replace(/\s+/g, '_')}.json`;
        a.click();
    }

    let currentMatchState = { active: false, startIndex: -1, textObj: null };

    document.addEventListener('input', function(e) {
        if (e.target.tagName.toLowerCase() === 'textarea') {
            handleAutocomplete(e.target);
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.autocomplete-items')) closeDropdowns();
    });

    function handleAutocomplete(textarea) {
        const val = textarea.value;
        const cursorPos = textarea.selectionStart;
        const textBeforeCursor = val.substring(0, cursorPos);
        const match = textBeforeCursor.match(/@([a-zA-Z0-9.]*)$/);

        closeDropdowns();

        if (match) {
            currentMatchState = { active: true, startIndex: match.index, textObj: textarea };
            const levelSelect = document.getElementById('level'); 
            const selectedLevel = levelSelect ? levelSelect.value : "Level II"; 
            const searchStr = match[1].toLowerCase();
            const dataList = competencyData[selectedLevel] || competencyData["Level II"];
            
            const filtered = dataList.filter(item => 
                item.id.toLowerCase().includes(searchStr) || 
                item.desc.toLowerCase().includes(searchStr)
            );

            if (filtered.length > 0) showDropdown(textarea, filtered, searchStr);
        } else {
            currentMatchState.active = false;
        }
    }

    function showDropdown(textarea, list, searchStr) {
        if (window.getComputedStyle(textarea.parentNode).position === 'static') {
            textarea.parentNode.style.position = 'relative';
        }

        const dropdown = document.createElement("div");
        dropdown.setAttribute("class", "autocomplete-items");
        dropdown.style.top = (textarea.offsetTop + textarea.offsetHeight) + "px";
        dropdown.style.left = textarea.offsetLeft + "px";
        dropdown.style.width = textarea.offsetWidth + "px";
        
        list.forEach(item => {
            const div = document.createElement("div");
            const regex = new RegExp("(" + searchStr + ")", "gi");
            const displayId = item.id.replace(regex, "<strong>$1</strong>");
            
            div.innerHTML = `${displayId} - ${item.desc}`;
            div.addEventListener("click", function() { insertTag(item.id); });
            dropdown.appendChild(div);
        });

        textarea.parentNode.appendChild(dropdown);
    }

    function insertTag(id) {
        if (!currentMatchState.active) return;
        const textarea = currentMatchState.textObj;
        const val = textarea.value;
        const start = currentMatchState.startIndex;
        const end = textarea.selectionStart;
        
        const insertText = `@${id} [] `;
        textarea.value = val.substring(0, start) + insertText + val.substring(end);
        
        const newCursorPos = start + insertText.length - 2;
        textarea.focus();
        textarea.setSelectionRange(newCursorPos, newCursorPos);
        closeDropdowns();
    }

    function closeDropdowns() {
        const items = document.querySelectorAll(".autocomplete-items");
        items.forEach(item => item.parentNode.removeChild(item));
    }

    addEngagement('PE');
