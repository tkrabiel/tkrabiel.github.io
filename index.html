<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCG Rules of the Road Exam</title>
    <style>
        :root {
            --primary: #003366;
            --background: #f4f7f6;
            --correct: #28a745;
            --wrong: #dc3545;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #app {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Setup Screen */
        .setup-container {
            text-align: center;
            padding: 20px;
        }

        input[type="number"] {
            padding: 10px;
            font-size: 16px;
            width: 100px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #002244;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Exam Screen */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .diagram-link {
            display: inline-block;
            background-color: #e2e8f0;
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .diagram-link:hover {
            background-color: #cbd5e1;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            color: var(--text);
            border: 2px solid #e2e8f0;
            text-align: left;
            padding: 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eef2f5;
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }

        #next-btn-container {
            margin-top: 20px;
            text-align: right;
        }

        .feedback-text {
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="setup-screen" class="screen active">
        <h1>Rules of the Road Exam</h1>
        <div class="setup-container">
            <p id="loading-text">Loading complete question bank...</p>
            <div id="setup-form" style="display: none;">
                <p>How many random questions would you like to take?</p>
                <input type="number" id="num-questions" min="1" value="50">
                <br>
                <span id="max-questions-label" style="font-size: 0.9em; color: #666;"></span>
                <br>
                <button onclick="startExam()">Start Exam</button>
            </div>
        </div>
    </div>

    <div id="exam-screen" class="screen">
        <div class="status-bar">
            <span id="progress-text">Question 1 of X</span>
            <span id="score-text">Score: 0</span>
        </div>
        
        <div id="question-container">
            <div class="question-text" id="question-text">Question goes here...</div>
            <div id="diagram-container"></div>
            <div class="options-grid" id="options-grid">
                </div>
        </div>

        <div id="feedback-container" class="feedback-text"></div>

        <div id="next-btn-container" style="display: none;">
            <button id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h1>Exam Complete!</h1>
        <div class="setup-container">
            <h2 id="final-score">You scored: 0 / X</h2>
            <p id="final-percentage"></p>
            <button onclick="restart()">Take Another Exam</button>
        </div>
    </div>
</div>

<script>
    let allQuestions = [];
    let currentExam = [];
    let currentIndex = 0;
    let score = 0;

    // 1. Fetch JSON on load
    window.onload = async () => {
        try {
            // Using the complete question bank JSON file generated previously
            const response = await fetch('USCG_ROTR_Complete_Questions.json');
            if (!response.ok) throw new Error("Could not load JSON file.");
            allQuestions = await response.json();
            
            // Enable UI
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('setup-form').style.display = 'block';
            
            // Set max questions based on JSON length
            const numInput = document.getElementById('num-questions');
            numInput.max = allQuestions.length;
            if (allQuestions.length < 50) numInput.value = allQuestions.length;
            document.getElementById('max-questions-label').innerText = `(Available: ${allQuestions.length} Questions)`;
            
        } catch (error) {
            document.getElementById('loading-text').innerText = "Error loading JSON: Please ensure you are running a local web server and 'USCG_ROTR_Complete_Questions.json' is in the exact same folder.";
            document.getElementById('loading-text').style.color = "red";
            console.error(error);
        }
    };

    // 2. Start Exam Logic
    function startExam() {
        let requestedCount = parseInt(document.getElementById('num-questions').value);
        if (isNaN(requestedCount) || requestedCount < 1) requestedCount = 1;
        if (requestedCount > allQuestions.length) requestedCount = allQuestions.length;

        // Shuffle all questions and slice the requested amount
        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        currentExam = shuffled.slice(0, requestedCount);

        currentIndex = 0;
        score = 0;

        switchScreen('exam-screen');
        renderQuestion();
    }

    // 3. Render Current Question
    function renderQuestion() {
        const q = currentExam[currentIndex];
        
        // Update Status Bar
        document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} of ${currentExam.length}`;
        document.getElementById('score-text').innerText = `Score: ${score}`;
        
        // Update Question Text
        document.getElementById('question-text').innerText = `(${q.id}) ${q.question}`;

        // Handle Diagram
        const diagramContainer = document.getElementById('diagram-container');
        diagramContainer.innerHTML = '';
        if (q.diagram && q.diagram.referenced) {
            const link = document.createElement('a');
            link.href = q.diagram.link;
            link.target = '_blank';
            link.className = 'diagram-link';
            link.innerText = `📄 View Reference: ${q.diagram.name}`;
            diagramContainer.appendChild(link);
        }

        // Render Options
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        Object.entries(q.options).forEach(([letter, text]) => {
            // Check if the option is not just empty whitespace
            if (!text || text.trim() === "") return; 
            
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${letter}. ${text}`;
            btn.onclick = () => checkAnswer(letter, btn);
            // Save the letter data attribute for later checking
            btn.dataset.letter = letter; 
            optionsGrid.appendChild(btn);
        });

        // Reset Feedback and Next Button
        document.getElementById('feedback-container').innerText = '';
        document.getElementById('next-btn-container').style.display = 'none';
    }

    // 4. Check Answer
    function checkAnswer(selectedLetter, btnElement) {
        const q = currentExam[currentIndex];
        const correctLetter = q.correct_answer;
        const feedback = document.getElementById('feedback-container');
        const allButtons = document.querySelectorAll('.option-btn');

        // Disable all buttons to prevent multiple clicks
        allButtons.forEach(b => b.disabled = true);

        if (selectedLetter === correctLetter) {
            btnElement.classList.add('correct');
            feedback.innerText = '✅ Correct!';
            feedback.style.color = 'var(--correct)';
            score++;
        } else {
            btnElement.classList.add('wrong');
            feedback.innerText = `❌ Incorrect. The correct answer was ${correctLetter}.`;
            feedback.style.color = 'var(--wrong)';
            
            // Highlight the correct answer
            allButtons.forEach(b => {
                if (b.dataset.letter === correctLetter) {
                    b.classList.add('correct');
                }
            });
        }

        // Update score display immediately
        document.getElementById('score-text').innerText = `Score: ${score}`;

        // Show Next Button
        const nextBtnContainer = document.getElementById('next-btn-container');
        const nextBtn = document.getElementById('next-btn');
        nextBtnContainer.style.display = 'block';
        
        if (currentIndex === currentExam.length - 1) {
            nextBtn.innerText = "Finish Exam";
        } else {
            nextBtn.innerText = "Next Question";
        }
    }

    // 5. Navigate to Next or Finish
    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= currentExam.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    // 6. Show Final Results
    function showResults() {
        switchScreen('result-screen');
        const percentage = Math.round((score / currentExam.length) * 100);
        document.getElementById('final-score').innerText = `You scored: ${score} / ${currentExam.length}`;
        document.getElementById('final-percentage').innerText = `Grade: ${percentage}%`;
    }

    // 7. Restart Application
    function restart() {
        switchScreen('setup-screen');
    }

    // Utility: Switch Active Screen
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>

</body>
</html>
