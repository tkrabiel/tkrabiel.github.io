<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTIFF Sonifier – Draw a line and hear the pixels</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2f;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #2d2d3a;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .version-tag {
            position: absolute;
            top: 20px;
            right: 25px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #6a6a80;
            background: #1e1e2a;
            padding: 4px 8px;
            border-radius: 6px;
        }
        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 1.8rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .ctrl-group {
            background: #3a3a4a;
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-flex;
            flex-direction: column;
            gap: 5px;
        }
        .ctrl-group label {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        button, input, select {
            background: #4c4c5e;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background: #6a6a80;
        }
        input[type="file"] {
            background: #2d2d3a;
            padding: 5px;
        }
        .canvas-area {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #1e1e2a;
            border-radius: 16px;
            padding: 10px;
        }
        canvas {
            border: 2px solid #5a5a70;
            border-radius: 12px;
            cursor: crosshair;
            max-width: 100%;
            height: auto;
            background: #000;
        }
        .status {
            background: #0f0f1a;
            padding: 10px;
            border-radius: 12px;
            font-family: monospace;
            margin-top: 15px;
            text-align: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
</head>
<body>
<div class="container">
    <div class="version-tag">Version 4</div>
    
    <h1>🎵 GeoTIFF Sonifier</h1>
    <div class="controls">
        <div class="ctrl-group">
            <label>📁 GeoTIFF file</label>
            <input type="file" id="fileInput" accept=".tif,.tiff">
        </div>
        
        <div class="ctrl-group">
            <label>🎹 Mode</label>
            <select id="modeSelect">
                <option value="scale">Musical Scale (Notes)</option>
                <option value="raw">Raw Frequency (Drone)</option>
            </select>
        </div>

        <div class="ctrl-group" id="scaleGroup">
            <label>🎼 Musical Scale</label>
            <select id="scalePreset">
                <option value="pentatonic">C Major Pentatonic (Dreamy)</option>
                <option value="minor">A Minor (Moody)</option>
                <option value="chromatic">Chromatic (All Notes)</option>
            </select>
        </div>

        <div class="ctrl-group" id="rawFreqGroup" style="display:none">
            <label>🎤 Vocal Range</label>
            <select id="rangePreset">
                <option value="bass">Bass (80–320 Hz)</option>
                <option value="tenor" selected>Tenor (130–520 Hz)</option>
                <option value="alto">Alto (260–1040 Hz)</option>
                <option value="soprano">Soprano (520–2080 Hz)</option>
            </select>
        </div>

        <div class="ctrl-group">
            <label>🗣️ Timbre / Voice</label>
            <select id="voicePreset">
                <option value="rich">Rich Organ / Choir</option>
                <option value="sine">Pure Sine (Beep)</option>
            </select>
        </div>

        <div class="ctrl-group">
            <label>⏱️ Duration per pixel (s)</label>
            <input type="number" id="duration" value="0.15" step="0.01" min="0.03" max="1.0">
        </div>
        <div class="ctrl-group">
            <label>🔢 Number of samples</label>
            <input type="number" id="numSamples" value="150" step="10" min="10" max="1000">
        </div>
        <div class="ctrl-group">
            <button id="generateBtn">🎧 Generate & Play</button>
            <button id="stopBtn">⏹️ Stop</button>
            <button id="exportBtn">💾 Export WAV</button>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="imageCanvas" width="800" height="600" style="width:100%; height:auto; max-width:800px"></canvas>
    </div>

    <div class="status" id="statusMsg">
        ✅ Upload a GeoTIFF, then click two points on the image to draw a line.
    </div>
</div>

<script>
    // ---------- Global state ----------
    let geotiffImage = null;          
    let rasterData = null;            
    let imageWidth = 0, imageHeight = 0;
    let minPixel = 0, maxPixel = 1;   
    let canvas = document.getElementById('imageCanvas');
    let ctx = canvas.getContext('2d');
    
    // Drawing state
    let points = [];                  
    let lineDrawn = false;
    
    // Audio state
    let activeContext = null;
    let currentSource = null;
    let currentAudioBuffer = null;    
    
    // Canvas transform (display scaling)
    let drawOffsetX = 0, drawOffsetY = 0;
    let drawWidth = 0, drawHeight = 0;

    // ---------- Musical Scales (MIDI Note Numbers) ----------
    const scales = {
        // C3 to C6 Pentatonic
        pentatonic: [48, 50, 52, 55, 57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81, 84],
        // A2 to A5 Minor
        minor: [45, 47, 48, 50, 52, 53, 55, 57, 59, 60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81],
        // C3 to C5 Chromatic
        chromatic: Array.from({length: 25}, (_, i) => 48 + i) 
    };
    
    // ---------- Helper: update canvas transform ----------
    function updateCanvasTransform() {
        if (imageWidth === 0) return;
        const maxWidth = canvas.clientWidth;
        const maxHeight = canvas.clientHeight;
        const scale = Math.min(maxWidth / imageWidth, maxHeight / imageHeight);
        
        drawWidth = Math.floor(imageWidth * scale);
        drawHeight = Math.floor(imageHeight * scale);
        drawOffsetX = Math.floor((maxWidth - drawWidth) / 2);
        drawOffsetY = Math.floor((maxHeight - drawHeight) / 2);
        
        canvas.width = maxWidth;
        canvas.height = maxHeight;
        if (rasterData) drawImageOnCanvas();
    }
    
    // ---------- Draw image from rasterData ----------
    function drawImageOnCanvas() {
        if (!rasterData || imageWidth === 0 || drawWidth <= 0 || drawHeight <= 0) return;
        let imgData = ctx.createImageData(drawWidth, drawHeight);
        
        for (let y = 0; y < drawHeight; y++) {
            for (let x = 0; x < drawWidth; x++) {
                const srcX = Math.floor(x * imageWidth / drawWidth);
                const srcY = Math.floor(y * imageHeight / drawHeight);
                const idx = srcY * imageWidth + srcX;
                let val = rasterData[idx];
                
                let norm = (maxPixel === minPixel) ? 0 : (val - minPixel) / (maxPixel - minPixel);
                let gray = Math.min(255, Math.max(0, Math.floor(norm * 255)));
                
                const pixelIdx = (y * drawWidth + x) * 4;
                imgData.data[pixelIdx] = gray;
                imgData.data[pixelIdx+1] = gray;
                imgData.data[pixelIdx+2] = gray;
                imgData.data[pixelIdx+3] = 255;
            }
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.putImageData(imgData, drawOffsetX, drawOffsetY);
        drawLineOnCanvas();
    }
    
    // ---------- Draw line overlay ----------
    function drawLineOnCanvas() {
        if (!lineDrawn || points.length < 2) return;
        ctx.save();
        ctx.beginPath();
        function imgToCanvas(p) {
            return {
                x: drawOffsetX + (p.x / imageWidth) * drawWidth,
                y: drawOffsetY + (p.y / imageHeight) * drawHeight
            };
        }
        const start = imgToCanvas(points[0]);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < points.length; i++) {
            const pt = imgToCanvas(points[i]);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        
        points.forEach(p => {
            const cp = imgToCanvas(p);
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, 6, 0, 2*Math.PI);
            ctx.fillStyle = '#ffaa44';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, 3, 0, 2*Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        });
        ctx.restore();
    }
    
    // ---------- Load GeoTIFF ----------
    async function loadGeoTiff(file) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.innerHTML = '⏳ Reading GeoTIFF...';
        try {
            const tiff = await GeoTIFF.fromBlob(file);
            const image = await tiff.getImage();
            const rasters = await image.readRasters();
            
            let data = rasters[0];
            if (!data) throw new Error('No raster band found');
            
            let minVal = Infinity, maxVal = -Infinity;
            for (let i=0; i<data.length; i++) {
                if (data[i] < minVal) minVal = data[i];
                if (data[i] > maxVal) maxVal = data[i];
            }
            
            imageWidth = image.getWidth();
            imageHeight = image.getHeight();
            rasterData = data;
            minPixel = minVal;
            maxPixel = maxVal;
            geotiffImage = image;
            lineDrawn = false;
            points = [];
            
            statusDiv.innerHTML = `✅ Loaded ${imageWidth}×${imageHeight} | values ${minVal.toFixed(2)} – ${maxVal.toFixed(2)}. Click two points to draw line.`;
            updateCanvasTransform();
        } catch (err) {
            console.error(err);
            statusDiv.innerHTML = `❌ Error: ${err.message}`;
        }
    }
    
    // ---------- Get pixel value (bilinear) ----------
    function getPixelValue(x, y) {
        if (x < 0 || x >= imageWidth-1 || y < 0 || y >= imageHeight-1) return minPixel;
        const x0 = Math.floor(x);
        const y0 = Math.floor(y);
        const fx = x - x0;
        const fy = y - y0;
        const v00 = rasterData[y0 * imageWidth + x0];
        const v10 = rasterData[y0 * imageWidth + (x0+1)];
        const v01 = rasterData[(y0+1) * imageWidth + x0];
        const v11 = rasterData[(y0+1) * imageWidth + (x0+1)];
        const top = v00 * (1-fx) + v10 * fx;
        const bottom = v01 * (1-fx) + v11 * fx;
        return top * (1-fy) + bottom * fy;
    }
    
    // ---------- Sample values along the line ----------
    function sampleLine(numSamples) {
        if (points.length < 2) throw new Error('Draw a line first.');
        const p1 = points[0], p2 = points[1];
        const values = [];
        for (let i = 0; i < numSamples; i++) {
            const t = i / (numSamples - 1);
            values.push(getPixelValue(p1.x + t * (p2.x - p1.x), p1.y + t * (p2.y - p1.y)));
        }
        return values;
    }
    
    // ---------- Generate AudioBuffer ----------
    async function generateAudioBuffer(values, durationPerSample, sampleRate=44100) {
        const numSamples = values.length;
        const totalFrames = Math.ceil(numSamples * durationPerSample * sampleRate);
        const audioBuffer = new (window.AudioContext || window.webkitAudioContext)({sampleRate}).createBuffer(1, totalFrames, sampleRate);
        const channelData = audioBuffer.getChannelData(0);
        
        const mode = document.getElementById('modeSelect').value;
        const scalePreset = document.getElementById('scalePreset').value;
        const voiceType = document.getElementById('voicePreset').value;
        const currentScale = scales[scalePreset];
        
        // Get raw freq range if needed
        let minFreq = 130, maxFreq = 520;
        const rangeSel = document.getElementById('rangePreset').value;
        if (rangeSel === 'bass') { minFreq = 80; maxFreq = 320; }
        else if (rangeSel === 'alto') { minFreq = 260; maxFreq = 1040; }
        else if (rangeSel === 'soprano') { minFreq = 520; maxFreq = 2080; }

        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const rangeVal = maxVal - minVal;
        
        let frameIndex = 0;
        for (let i = 0; i < numSamples; i++) {
            let freq;
            let t = rangeVal === 0 ? 0.5 : (values[i] - minVal) / rangeVal;

            if (mode === 'scale') {
                // Quantize to musical scale
                const scaleIndex = Math.min(currentScale.length - 1, Math.floor(t * currentScale.length));
                const midiNote = currentScale[scaleIndex];
                freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            } else {
                // Raw continuous frequency
                freq = minFreq + t * (maxFreq - minFreq);
            }

            const startFrame = frameIndex;
            const endFrame = startFrame + Math.floor(durationPerSample * sampleRate);
            
            for (let f = startFrame; f < endFrame && f < totalFrames; f++) {
                const time = (f - startFrame) / sampleRate;
                
                // Envelopes shape the note so it doesn't click.
                // In Scale mode, we want a plucked/sung feel. In Raw mode, a continuous drone.
                let envelope = 1.0;
                if (mode === 'scale') {
                    const attack = durationPerSample * 0.1;
                    const release = durationPerSample * 0.3;
                    if (time < attack) envelope = time / attack; // Fade in
                    else if (time > durationPerSample - release) envelope = (durationPerSample - time) / release; // Fade out
                }

                // Voice synthesis
                let sampleVal = 0;
                if (voiceType === 'rich') {
                    // Fundamental + overtones for a choir/organ sound
                    sampleVal += Math.sin(2 * Math.PI * freq * time);
                    sampleVal += 0.5 * Math.sin(2 * Math.PI * (freq * 2) * time); 
                    sampleVal += 0.25 * Math.sin(2 * Math.PI * (freq * 3) * time); 
                    sampleVal += 0.125 * Math.sin(2 * Math.PI * (freq * 4) * time); 
                    sampleVal = sampleVal / 1.875; // Normalize volume
                } else {
                    // Pure Sine
                    sampleVal = Math.sin(2 * Math.PI * freq * time);
                }

                channelData[f] += sampleVal * envelope;
            }
            frameIndex = endFrame;
        }

        // Normalize to avoid clipping
        let maxAmp = 0;
        for (let i=0; i<totalFrames; i++) maxAmp = Math.max(maxAmp, Math.abs(channelData[i]));
        if (maxAmp > 0.95) {
            for (let i=0; i<totalFrames; i++) channelData[i] *= 0.9 / maxAmp;
        }
        return audioBuffer;
    }
    
    // ---------- Play & Stop ----------
    function playBuffer(audioBuffer) {
        if (activeContext) activeContext.close().catch(console.warn);
        activeContext = new (window.AudioContext || window.webkitAudioContext)();
        currentSource = activeContext.createBufferSource();
        currentSource.buffer = audioBuffer;
        currentSource.connect(activeContext.destination);
        currentSource.onended = () => { if (activeContext) activeContext = null; };
        currentSource.start();
        document.getElementById('statusMsg').innerHTML = '🔊 Playing ...';
    }
    
    function stopPlayback() {
        if (activeContext) { activeContext.close(); activeContext = null; }
        if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
        document.getElementById('statusMsg').innerHTML = '⏹️ Stopped.';
    }
    
    // ---------- WAV Export ----------
    function exportWav(audioBuffer) {
        if (!audioBuffer) return alert("Generate audio first.");
        const buffer = new ArrayBuffer(44 + audioBuffer.length * 2);
        const view = new DataView(buffer);
        const writeString = (offset, str) => { for (let i=0; i<str.length; i++) view.setUint8(offset+i, str.charCodeAt(i)); };
        
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + audioBuffer.length * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, audioBuffer.sampleRate, true);
        view.setUint32(28, audioBuffer.sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, audioBuffer.length * 2, true);
        
        let offset = 44, data = audioBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            let s = Math.max(-1, Math.min(1, data[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
        }
        
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        a.download = 'sonification.wav';
        a.click();
        document.getElementById('statusMsg').innerHTML = '📀 WAV exported.';
    }
    
    // ---------- UI Events ----------
    document.getElementById('modeSelect').addEventListener('change', (e) => {
        if (e.target.value === 'scale') {
            document.getElementById('scaleGroup').style.display = 'inline-flex';
            document.getElementById('rawFreqGroup').style.display = 'none';
        } else {
            document.getElementById('scaleGroup').style.display = 'none';
            document.getElementById('rawFreqGroup').style.display = 'inline-flex';
        }
    });

    document.getElementById('fileInput').addEventListener('change', (e) => { if (e.target.files[0]) loadGeoTiff(e.target.files[0]); });
    document.getElementById('generateBtn').addEventListener('click', async () => {
        if (!rasterData) return alert('Upload a GeoTIFF first.');
        if (points.length < 2) return alert('Draw a line first.');
        document.getElementById('statusMsg').innerHTML = '🎛️ Generating...';
        try {
            const values = sampleLine(parseInt(document.getElementById('numSamples').value));
            currentAudioBuffer = await generateAudioBuffer(values, parseFloat(document.getElementById('duration').value));
            playBuffer(currentAudioBuffer);
        } catch (err) {
            document.getElementById('statusMsg').innerHTML = `❌ Error: ${err.message}`;
        }
    });
    document.getElementById('stopBtn').addEventListener('click', stopPlayback);
    document.getElementById('exportBtn').addEventListener('click', () => exportWav(currentAudioBuffer));
    
    canvas.addEventListener('click', (e) => {
        if (!rasterData) return alert('Load a GeoTIFF first.');
        const rect = canvas.getBoundingClientRect();
        let imgX = ((e.clientX - rect.left) * (canvas.width / rect.width) - drawOffsetX) / drawWidth * imageWidth;
        let imgY = ((e.clientY - rect.top) * (canvas.height / rect.height) - drawOffsetY) / drawHeight * imageHeight;
        if (imgX < 0 || imgX >= imageWidth || imgY < 0 || imgY >= imageHeight) return;
        
        if (points.length >= 2 || !lineDrawn) points = [];
        points.push({x: imgX, y: imgY});
        lineDrawn = points.length === 2;
        drawImageOnCanvas();
        document.getElementById('statusMsg').innerHTML = lineDrawn ? 'Ready to generate.' : 'First point set.';
    });
    
    window.addEventListener('resize', updateCanvasTransform);
    updateCanvasTransform();
</script>
</body>
</html>
