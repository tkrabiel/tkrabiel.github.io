<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCG Rules of the Road Exam</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        :root {
            --primary: #003366;
            --secondary: #4a5568;
            --background: #f4f7f6;
            --correct: #28a745;
            --wrong: #dc3545;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #app {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Setup Screen */
        .setup-container {
            text-align: center;
            padding: 20px;
        }

        input[type="number"] {
            padding: 12px;
            font-size: 16px;
            width: 120px;
            margin: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #002244;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        button.secondary-btn {
            background-color: var(--secondary);
        }

        button.secondary-btn:hover {
            background-color: #2d3748;
        }

        button:disabled {
            background-color: #a0aec0 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Exam Screen */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            color: var(--secondary);
        }

        .question-text {
            font-size: 1.25rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .diagram-link {
            display: inline-block;
            background-color: #edf2f7;
            color: var(--primary);
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px solid #cbd5e1;
        }

        .diagram-link:hover {
            background-color: #e2e8f0;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fff;
            color: var(--text);
            border: 2px solid #e2e8f0;
            text-align: left;
            padding: 16px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }

        #next-btn-container {
            margin-top: 30px;
            text-align: right;
        }

        .feedback-text {
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
            font-size: 1.2rem;
            min-height: 28px;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="setup-screen" class="screen active">
        <h1>Rules of the Road Exam</h1>
        <div class="setup-container">
            <p id="loading-text" style="font-weight: bold; color: var(--secondary);">Loading complete question bank...</p>
            
            <div id="setup-form" style="display: none;">
                <p style="font-size: 1.1rem; margin-bottom: 5px;">How many random questions would you like?</p>
                <input type="number" id="num-questions" min="1" value="50">
                <br>
                <span id="max-questions-label" style="font-size: 0.95em; color: #718096; font-weight: bold;"></span>
                
                <div class="btn-group">
                    <button onclick="startExam()">Take Interactive Exam</button>
                    <button id="pdf-btn" class="secondary-btn" onclick="generatePDF()">📄 Download PDF Exam</button>
                </div>
            </div>
        </div>
    </div>

    <div id="exam-screen" class="screen">
        <div class="status-bar">
            <span id="progress-text">Question 1 of X</span>
            <span id="score-text">Score: 0</span>
        </div>
        
        <div id="question-container">
            <div class="question-text" id="question-text">Question goes here...</div>
            <div id="diagram-container"></div>
            <div class="options-grid" id="options-grid">
                </div>
        </div>

        <div id="feedback-container" class="feedback-text"></div>

        <div id="next-btn-container" style="display: none;">
            <button id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h1>Exam Complete!</h1>
        <div class="setup-container">
            <h2 id="final-score" style="font-size: 2rem; margin-bottom: 10px;">You scored: 0 / X</h2>
            <p id="final-percentage" style="font-size: 1.5rem; font-weight: bold; margin-bottom: 30px;"></p>
            <button onclick="restart()">Back to Home</button>
        </div>
    </div>
</div>

<script>
    let allQuestions = [];
    let currentExam = [];
    let currentIndex = 0;
    let score = 0;

    // 1. Fetch JSON on load
    window.onload = async () => {
        try {
            // Point this to your master merged JSON file
            const response = await fetch('USCG_ROTR_Merged_Questions.json');
            if (!response.ok) throw new Error("Could not load JSON file.");
            allQuestions = await response.json();
            
            // Enable UI
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('setup-form').style.display = 'block';
            
            // Set max questions based on JSON length
            const numInput = document.getElementById('num-questions');
            numInput.max = allQuestions.length;
            if (allQuestions.length < 50) numInput.value = allQuestions.length;
            document.getElementById('max-questions-label').innerText = `(Database loaded: ${allQuestions.length} Questions)`;
            
        } catch (error) {
            document.getElementById('loading-text').innerText = "Error loading JSON: Please ensure you are running a local web server and 'USCG_ROTR_Merged_Questions.json' is in the exact same folder.";
            document.getElementById('loading-text').style.color = "red";
            console.error(error);
        }
    };

    // ---------------------------------------------------------
    // PDF GENERATION LOGIC
    // ---------------------------------------------------------
    async function generatePDF() {
        if (allQuestions.length === 0) return;

        let requestedCount = parseInt(document.getElementById('num-questions').value);
        if (isNaN(requestedCount) || requestedCount < 1) requestedCount = 1;
        if (requestedCount > allQuestions.length) requestedCount = allQuestions.length;

        // Provide visual feedback that generation is happening
        const pdfBtn = document.getElementById('pdf-btn');
        const originalText = pdfBtn.innerHTML;
        pdfBtn.innerHTML = "⏳ Generating PDF... Please wait";
        pdfBtn.disabled = true;

        // Give the UI a millisecond to update the button text before blocking the thread
        setTimeout(() => {
            // Shuffle and slice
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
            const examQuestions = shuffled.slice(0, requestedCount);

            // Build HTML container for the PDF
            const container = document.createElement('div');
            container.style.padding = '30px';
            container.style.fontFamily = 'Helvetica, Arial, sans-serif';
            container.style.color = '#1a202c';
            container.style.lineHeight = '1.5';

            // PDF Title Page/Header
            let html = `
                <div style="text-align: center; margin-bottom: 40px;">
                    <h1 style="color: #003366; margin-bottom: 5px; font-size: 28px;">USCG Rules of the Road</h1>
                    <h2 style="color: #4a5568; margin-top: 0; font-size: 20px;">Practice Examination</h2>
                    <p style="font-size: 16px; color: #718096; font-weight: bold;">Total Questions: ${requestedCount}</p>
                </div>
            `;

            // Setup Answer Key HTML simultaneously
            let answersHtml = `
                <div class="html2pdf__page-break"></div>
                <div style="text-align: center; margin-bottom: 30px;">
                    <h1 style="color: #003366; font-size: 28px;">Answer Key</h1>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: flex-start; font-size: 14px;">
            `;

            // Loop through questions
            examQuestions.forEach((q, index) => {
                // page-break-inside: avoid ensures questions don't get cut in half vertically across pages
                html += `<div style="margin-bottom: 25px; page-break-inside: avoid; border-bottom: 1px solid #edf2f7; padding-bottom: 15px;">`;
                html += `<div style="font-size: 16px; font-weight: bold; margin-bottom: 10px;">${index + 1}. [${q.id}] ${q.question}</div>`;
                
                if (q.diagram && q.diagram.referenced) {
                    html += `<div style="font-style: italic; color: #e53e3e; font-weight: bold; margin-bottom: 10px; font-size: 14px;">(Refer to ${q.diagram.name} in ${q.diagram.link})</div>`;
                }

                Object.entries(q.options).forEach(([letter, text]) => {
                    if (text && text.trim() !== "") {
                        html += `<div style="margin-left: 25px; margin-bottom: 6px; font-size: 15px;"><strong>${letter}.</strong> ${text}</div>`;
                    }
                });
                html += `</div>`;

                // Add to answer key (width ensures neat columns)
                answersHtml += `<div style="width: 80px; padding: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; text-align: center;"><strong>${index + 1}.</strong> <span style="color: #28a745; font-weight: bold;">${q.correct_answer}</span></div>`;
            });

            answersHtml += `</div>`;
            container.innerHTML = html + answersHtml;

            // Configure html2pdf settings
            const opt = {
                margin:       15,
                filename:     'USCG_ROTR_Practice_Exam.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'letter', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };

            // Generate and save
            html2pdf().set(opt).from(container).save().then(() => {
                // Restore button
                pdfBtn.innerHTML = originalText;
                pdfBtn.disabled = false;
            });

        }, 100); // 100ms timeout allows the UI to render the "Generating PDF" text
    }

    // ---------------------------------------------------------
    // INTERACTIVE EXAM LOGIC
    // ---------------------------------------------------------
    function startExam() {
        let requestedCount = parseInt(document.getElementById('num-questions').value);
        if (isNaN(requestedCount) || requestedCount < 1) requestedCount = 1;
        if (requestedCount > allQuestions.length) requestedCount = allQuestions.length;

        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        currentExam = shuffled.slice(0, requestedCount);

        currentIndex = 0;
        score = 0;

        switchScreen('exam-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const q = currentExam[currentIndex];
        
        document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} of ${currentExam.length}`;
        document.getElementById('score-text').innerText = `Score: ${score}`;
        document.getElementById('question-text').innerText = `(${q.id}) ${q.question}`;

        const diagramContainer = document.getElementById('diagram-container');
        diagramContainer.innerHTML = '';
        if (q.diagram && q.diagram.referenced) {
            const link = document.createElement('a');
            link.href = q.diagram.link;
            link.target = '_blank';
            link.className = 'diagram-link';
            link.innerText = `📄 View Reference: ${q.diagram.name}`;
            diagramContainer.appendChild(link);
        }

        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        Object.entries(q.options).forEach(([letter, text]) => {
            if (!text || text.trim() === "") return; 
            
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${letter}. ${text}`;
            btn.onclick = () => checkAnswer(letter, btn);
            btn.dataset.letter = letter; 
            optionsGrid.appendChild(btn);
        });

        document.getElementById('feedback-container').innerText = '';
        document.getElementById('next-btn-container').style.display = 'none';
    }

    function checkAnswer(selectedLetter, btnElement) {
        const q = currentExam[currentIndex];
        const correctLetter = q.correct_answer;
        const feedback = document.getElementById('feedback-container');
        const allButtons = document.querySelectorAll('.option-btn');

        allButtons.forEach(b => b.disabled = true);

        if (selectedLetter === correctLetter) {
            btnElement.classList.add('correct');
            feedback.innerText = '✅ Correct!';
            feedback.style.color = 'var(--correct)';
            score++;
        } else {
            btnElement.classList.add('wrong');
            feedback.innerText = `❌ Incorrect. The correct answer was ${correctLetter}.`;
            feedback.style.color = 'var(--wrong)';
            
            allButtons.forEach(b => {
                if (b.dataset.letter === correctLetter) {
                    b.classList.add('correct');
                }
            });
        }

        document.getElementById('score-text').innerText = `Score: ${score}`;

        const nextBtnContainer = document.getElementById('next-btn-container');
        const nextBtn = document.getElementById('next-btn');
        nextBtnContainer.style.display = 'block';
        
        if (currentIndex === currentExam.length - 1) {
            nextBtn.innerText = "Finish Exam";
        } else {
            nextBtn.innerText = "Next Question";
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= currentExam.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    function showResults() {
        switchScreen('result-screen');
        const percentage = Math.round((score / currentExam.length) * 100);
        document.getElementById('final-score').innerText = `You scored: ${score} / ${currentExam.length}`;
        
        const pctEl = document.getElementById('final-percentage');
        pctEl.innerText = `Final Grade: ${percentage}%`;
        pctEl.style.color = percentage >= 70 ? 'var(--correct)' : 'var(--wrong)';
    }

    function restart() {
        switchScreen('setup-screen');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>

</body>
</html>
